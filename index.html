<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단체복 출고·재고 관리 | QUETTA</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --nav:#1a2744;--nav2:#243560;--accent:#3b6cdb;--al:#eef3fd;
  --ok:#16a34a;--ok-bg:#dcfce7;--err:#dc2626;--err-bg:#fee2e2;
  --warn:#d97706;--warn-bg:#fef3c7;--info-bg:#dbeafe;--info:#1d4ed8;
  --bg:#f0f3f9;--sur:#fff;--bdr:#e2e8f0;--txt:#1e293b;--muted:#64748b;
  --font:'Noto Sans KR',sans-serif;--sw:220px
}
body{font-family:var(--font);background:var(--bg);color:var(--txt);font-size:13px;min-height:100vh}

/* LOGIN */
#loginWrap{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0f1e3d,#1a2744,#243a7a);display:flex;align-items:center;justify-content:center}
.lbox{background:#fff;border-radius:20px;padding:48px 40px;width:400px;text-align:center;box-shadow:0 24px 64px rgba(0,0,0,.4)}
.lbrand{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.ltitle{font-size:22px;font-weight:700;margin-bottom:4px}
.lsub{font-size:12px;color:var(--muted);margin-bottom:28px}
.lbox input[type=password]{width:100%;padding:12px 16px;border:2px solid var(--bdr);border-radius:10px;font-size:14px;font-family:var(--font);outline:none;margin-bottom:8px;transition:border-color .2s}
.lbox input:focus{border-color:var(--accent)}
.lroles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lrole{padding:8px 4px;border:2px solid var(--bdr);border-radius:9px;cursor:pointer;font-size:12px;font-weight:600;font-family:var(--font);background:#fff;color:var(--muted);transition:all .15s}
.lrole.sel{border-color:var(--accent);background:var(--al);color:var(--accent)}
.lbtn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:background .2s}
.lbtn:hover:not(:disabled){background:#2d56c0}
.lbtn:disabled{opacity:.6;cursor:not-allowed}
.lmsg{font-size:12px;margin-top:8px;min-height:18px}
.lmsg.err{color:var(--err)}.lmsg.info{color:var(--muted)}

/* APP */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sw);background:var(--nav);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sb-brand{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.sb-bname{font-size:14px;font-weight:700;color:#fff}
.sb-bsub{font-size:10px;color:rgba(255,255,255,.35);margin-top:2px}
.sb-role{margin:8px 16px;padding:5px 10px;border-radius:6px;background:rgba(255,255,255,.08);font-size:11px;font-weight:600;color:rgba(255,255,255,.6);text-align:center}
.sb-sec{padding:12px 16px 4px;font-size:9px;color:rgba(255,255,255,.25);text-transform:uppercase;letter-spacing:.8px}
.ni{display:flex;align-items:center;gap:9px;padding:10px 16px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;border-left:3px solid transparent;font-size:12.5px}
.ni:hover{background:var(--nav2);color:rgba(255,255,255,.9)}
.ni.active{background:rgba(59,108,219,.15);color:#fff;border-left-color:var(--accent);font-weight:600}
.ni .ico{font-size:15px;width:18px;text-align:center;flex-shrink:0}
.sb-foot{margin-top:auto;padding:12px 16px;border-top:1px solid rgba(255,255,255,.07)}
.lout{width:100%;padding:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:7px;color:rgba(255,255,255,.5);cursor:pointer;font-size:11.5px;font-family:var(--font);transition:all .2s}
.lout:hover{background:rgba(255,255,255,.1);color:#fff}

#main{flex:1;overflow-y:auto;padding:24px}
.tab{display:none}.tab.active{display:block}
.ph{margin-bottom:20px}
.pt{font-size:19px;font-weight:700}
.ps{font-size:12px;color:var(--muted);margin-top:3px}

/* CARDS */
.card{background:var(--sur);border-radius:12px;padding:20px;box-shadow:0 1px 4px rgba(0,0,0,.07);margin-bottom:16px}
.ct{font-size:13px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:7px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
.sc{background:var(--sur);border-radius:11px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.sc-l{font-size:11px;color:var(--muted);margin-bottom:6px}
.sc-v{font-size:24px;font-weight:700;line-height:1}
.sc-s{font-size:11px;color:var(--muted);margin-top:5px}

/* TABLES */
.tw{overflow-x:auto;border-radius:9px;border:1px solid var(--bdr)}
.tb{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
.tb th{background:#f7f9fc;padding:8px 10px;text-align:center;font-weight:600;color:var(--muted);border-bottom:2px solid var(--bdr);border-right:1px solid var(--bdr);font-size:11px;position:sticky;top:0;z-index:1}
.tb td{padding:7px 10px;text-align:center;border-bottom:1px solid var(--bdr);border-right:1px solid var(--bdr)}
.tb td:last-child,.tb th:last-child{border-right:none}
.tb tr:last-child td{border-bottom:none}
.tb .tleft{text-align:left}.tb .thd{background:#f7f9fc;font-weight:600}
.tb tr.gc td{border-top:2px solid #d0dbe8}
.pos{background:var(--ok-bg);color:var(--ok);font-weight:700}
.neg{background:var(--err-bg);color:var(--err);font-weight:700}
.pending-row{background:#fffbeb}

/* FORMS */
.fr{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fg select,.fg input[type=text],.fg input[type=number],.fg input[type=password]{
  padding:9px 12px;border:2px solid var(--bdr);border-radius:9px;
  font-family:var(--font);font-size:13px;outline:none;background:#fff;transition:border-color .2s
}
.fg select:focus,.fg input:focus{border-color:var(--accent)}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:8px;border:none;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:5px}
.bp{background:var(--accent);color:#fff}.bp:hover{background:#2d56c0}
.bo{background:#fff;color:var(--txt);border:2px solid var(--bdr)}.bo:hover{border-color:var(--accent);color:var(--accent)}
.bs{background:var(--ok);color:#fff}.bs:hover{background:#15803d}
.be{background:var(--err);color:#fff}.be:hover{background:#b91c1c}
.bw{background:var(--warn);color:#fff}.bw:hover{background:#b45309}
.btn-xs{padding:4px 9px;font-size:11px;border-radius:6px}
.btn-sm{padding:6px 12px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.bok{background:var(--ok-bg);color:#15803d}
.berr{background:var(--err-bg);color:#b91c1c}
.bwarn{background:var(--warn-bg);color:#92400e}
.binfo{background:var(--info-bg);color:var(--info)}
.bneu{background:#f1f5f9;color:var(--muted)}
.bpurple{background:#ede9fe;color:#7c3aed}

/* INFO BOX */
.ibox{background:var(--al);border:1px solid #c7d8f8;border-radius:9px;padding:10px 14px;font-size:12px;color:#2d56c0;margin-bottom:14px;line-height:1.6}

/* TABS */
.ttabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--bdr);padding-bottom:0}
.ttab{padding:8px 16px;border:none;background:none;cursor:pointer;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .15s}
.ttab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:center;justify-content:center;padding:16px}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:16px;max-height:90vh;overflow-y:auto;width:100%;box-shadow:0 24px 64px rgba(0,0,0,.3)}
.mh{padding:18px 22px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.mh-t{font-size:16px;font-weight:700}
.mclose{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;padding:2px}
.mclose:hover{color:var(--err)}
.mbody{padding:20px 22px}
.mfoot{padding:14px 22px;border-top:1px solid var(--bdr);display:flex;justify-content:flex-end;gap:8px;background:#fff;position:sticky;bottom:0}

/* DISPATCH MODAL ITEMS */
.ditem-section{margin-bottom:20px}
.ditem-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px solid var(--bdr)}
.ditem-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:10px 12px;background:#f8fafc;border-radius:9px;border:1px solid var(--bdr)}
.ditem-name{font-weight:600;font-size:12.5px;min-width:90px}
.ditem-stock{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:600}
.stock-ok{background:var(--ok-bg);color:var(--ok)}
.stock-low{background:var(--err-bg);color:var(--err)}
.stock-warn{background:var(--warn-bg);color:var(--warn)}

/* STUDENT SEARCH */
.stu-card{background:#f8fafc;border:1px solid var(--bdr);border-radius:10px;padding:14px;margin-bottom:12px}
.stu-name{font-size:16px;font-weight:700}
.stu-meta{font-size:11px;color:var(--muted);margin-top:3px}
.stu-actions{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}

/* HISTORY TABLE */
.hist-item-group{margin-bottom:14px}
.hist-item-label{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;padding:11px 18px;background:#1e293b;color:#fff;border-radius:10px;font-size:13px;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.toast.s{background:var(--ok)}.toast.e{background:var(--err)}.toast.w{background:var(--warn)}

/* LOADING */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--muted);gap:10px;font-size:13px}
.spin{width:18px;height:18px;border:2px solid var(--bdr);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* SEARCH BOX */
.search-box{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.search-box input{flex:1;padding:10px 14px;border:2px solid var(--bdr);border-radius:10px;font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}

/* SECTION HEADER */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}

/* PROG BAR */
.prog{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;margin-top:4px}
.prog-bar{height:100%;border-radius:3px;background:var(--accent);transition:width .3s}
.prog-bar.full{background:var(--ok)}
.prog-bar.low{background:var(--err)}

/* INLINE NUM INPUT */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}

/* NOTICE */
.notice{text-align:center;padding:32px;color:var(--muted);font-size:13px}

/* ITEM SECTION HEADING */
.isec{background:linear-gradient(135deg,#1a2744,#243a7a);color:#fff;border-radius:10px;padding:10px 16px;margin-bottom:12px;font-size:13px;font-weight:700}

/* TOOLTIP */
.tip-wrap{position:relative;display:inline-flex;align-items:center;cursor:help}
.tip-wrap .tip-box{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;font-size:11px;padding:6px 10px;border-radius:7px;white-space:nowrap;pointer-events:none;z-index:99;max-width:220px;white-space:normal;text-align:center;line-height:1.5}
.tip-wrap:hover .tip-box{display:block}

/* WITHDRAWAL */
.badge-withdrawn{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
.withdrawn-tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:#fef3c7;color:#92400e}

/* EXAM CLICK */
.exam-click{cursor:pointer;color:var(--accent);text-decoration:underline;font-weight:600}
.exam-click:hover{color:#2d56c0}

/* PARTIAL TAG */
.badge-partial{background:#ede9fe;color:#7c3aed}

/* EXC REASON */
.exc-reason-badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:999px;font-size:10px;font-weight:600;background:#ede9fe;color:#7c3aed;cursor:help}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginWrap">
  <div class="lbox">
    <div class="lbrand">QUETTA</div>
    <div class="ltitle">단체복 관리 시스템</div>
    <div class="lsub">역할을 선택하고 비밀번호를 입력해주세요</div>
    <div class="lroles">
      <button class="lrole sel" onclick="selRole('admin',this)">👑 관리자</button>
      <button class="lrole" onclick="selRole('assistant',this)">📋 조교</button>
      <button class="lrole" onclick="selRole('vendor',this)">🏭 업체</button>
    </div>
    <input type="password" id="lpw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="lbtn" id="lbtn" onclick="doLogin()">로그인</button>
    <div class="lmsg" id="lmsg"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <nav id="sidebar">
    <div class="sb-brand">
      <div class="sb-bname">🧥 단체복 관리</div>
      <div class="sb-bsub">QUETTA Uniform System</div>
    </div>
    <div class="sb-role" id="roleLabel">관리자</div>
    <div class="sb-sec">메인</div>
    <div class="ni active" data-tab="dashboard"><span class="ico">📊</span> 대시보드</div>
    <div class="sb-sec">운영</div>
    <div class="ni" data-tab="dispatch" id="nav-dispatch"><span class="ico">📤</span> 출고관리</div>
    <div class="ni" data-tab="missing"  id="nav-missing"> <span class="ico">⚠️</span> 미수령관리</div>
    <div class="ni" data-tab="stock"    id="nav-stock">   <span class="ico">📦</span> 재고관리</div>
    <div class="sb-sec">데이터</div>
    <div class="ni" data-tab="students" id="nav-students"><span class="ico">👥</span> 학생명단</div>
    <div class="ni" data-tab="settings" id="nav-settings"><span class="ico">⚙️</span> 설정</div>
    <div class="sb-foot"><button class="lout" onclick="doLogout()">로그아웃</button></div>
  </nav>

  <main id="main">
    <div id="tab-dashboard" class="tab active"></div>
    <div id="tab-dispatch"  class="tab"></div>
    <div id="tab-missing"   class="tab"></div>
    <div id="tab-stock"     class="tab"></div>
    <div id="tab-students"  class="tab"></div>
    <div id="tab-settings"  class="tab"></div>
  </main>
</div>

<!-- MODAL: 출고하기 -->
<div class="overlay" id="dispatchModal">
  <div class="modal" style="max-width:640px">
    <div class="mh"><span class="mh-t" id="dm-title">출고하기</span><button class="mclose" onclick="closeModal('dispatchModal')">×</button></div>
    <div class="mbody" id="dm-body"></div>
    <div class="mfoot">
      <button class="btn bo" onclick="closeModal('dispatchModal')">취소</button>
      <button class="btn bp" onclick="confirmDispatch()">💾 출고 확정</button>
    </div>
  </div>
</div>

<!-- MODAL: 반품/교환 -->
<div class="overlay" id="returnModal">
  <div class="modal" style="max-width:480px">
    <div class="mh"><span class="mh-t">반품 / 교환</span><button class="mclose" onclick="closeModal('returnModal')">×</button></div>
    <div class="mbody" id="rm-body"></div>
    <div class="mfoot">
      <button class="btn bo" onclick="closeModal('returnModal')">취소</button>
      <button class="btn bs" id="rm-confirm-btn" onclick="confirmReturn()">확인</button>
    </div>
  </div>
</div>

<!-- MODAL: 예외처리 -->
<div class="overlay" id="exceptionModal">
  <div class="modal" style="max-width:500px">
    <div class="mh"><span class="mh-t">예외처리 설정</span><button class="mclose" onclick="closeModal('exceptionModal')">×</button></div>
    <div class="mbody" id="em-body"></div>
    <div class="mfoot">
      <button class="btn bo" onclick="closeModal('exceptionModal')">취소</button>
      <button class="btn bp" onclick="confirmException()">저장</button>
    </div>
  </div>
</div>

<!-- MODAL: 메모 -->
<div class="overlay" id="memoModal">
  <div class="modal" style="max-width:420px">
    <div class="mh"><span class="mh-t">학생 메모</span><button class="mclose" onclick="closeModal('memoModal')">×</button></div>
    <div class="mbody" id="mm-body"></div>
    <div class="mfoot">
      <button class="btn bo" onclick="closeModal('memoModal')">취소</button>
      <button class="btn bp" onclick="saveMemo()">저장</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════
   🔥 FIREBASE — 아래 값을 본인 프로젝트로 교체
   ═══════════════════════════════════════════════ */
const FB = {
  apiKey: "AIzaSyBkwRLhxcJ9EyY09tdPQIzXSFvYvgDWRc8",
  authDomain: "quetta-uniform-4fcac.firebaseapp.com",
  projectId: "quetta-uniform-4fcac",
  storageBucket: "quetta-uniform-4fcac.firebasestorage.app",

  appId: "1:1077644655521:web:c469b0813f024fb69269e0"
};

const db = firebase.firestore();

/* ═══════════════════════════════════════════════
   상수 & 기본값
   ═══════════════════════════════════════════════ */
const DEFAULT_ITEMS = {
  '후드집업':   { season:'동복', sizes:['S','M','L','XL','3XL','4XL'] },
  '반집업세트': { season:'동복', sizes:['S','M','L','XL','3XL','4XL'] },
  '상의':       { season:'하복', sizes:['S','M','L','XL','3XL'] },
  '긴바지':     { season:'하복', sizes:['S','M','L','XL','3XL','4XL'] },
  '반바지':     { season:'하복', sizes:['S','M','L','XL','3XL','4XL'] }
};
const DEFAULT_COURSES = {
  '윈터': { '후드집업':1,'반집업세트':1,'상의':1,'하의_total':2 },
  '제로':  { '후드집업':1,'반집업세트':1,'상의':1,'하의_total':1 },
  '정규':  { '후드집업':1,'반집업세트':1,'상의':1,'하의_total':2 }
};
const DEFAULT_PWS = { admin:'quetta2025', assistant:'quetta0000', vendor:'quetta1111' };
const ROLE_LABELS = { admin:'👑 관리자', assistant:'📋 조교', vendor:'🏭 단체복업체' };
const DEFAULT_SEASONS = [String(new Date().getFullYear())];
const DEFAULT_DEFAULTS = { season: String(new Date().getFullYear()), course: '정규' };

/* ═══════════════════════════════════════════════
   앱 상태
   ═══════════════════════════════════════════════ */
let G = {
  role: 'admin',
  cfg: {
    passwords: DEFAULT_PWS,
    items: DEFAULT_ITEMS,
    courses: DEFAULT_COURSES,
    seasons: DEFAULT_SEASONS,
    defaults: DEFAULT_DEFAULTS,
  },

/* ═══════════════════════════════════════════════
   Firestore 헬퍼
   ═══════════════════════════════════════════════ */
async function getDoc(col, id) {
  const d = await db.collection(col).doc(id).get();
  return d.exists ? { id: d.id, ...d.data() } : null;
}
async function getDocs(col, ...wheres) {
  let q = db.collection(col);
  for (const [f,op,v] of wheres) q = q.where(f, op, v);
  const snap = await q.get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function setDoc(col, id, data) {
  await db.collection(col).doc(id).set(data, { merge: true });
}
async function addDoc(col, data) {
  const ref = await db.collection(col).add({ ...data, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  return ref.id;
}
async function updateDoc(col, id, data) {
  await db.collection(col).doc(id).update(data);
}
async function deleteDoc(col, id) {
  await db.collection(col).doc(id).delete();
}

   설정 로드/저장

async function loadConfig() {
  const d = await getDoc('settings', 'config');
  if (d) {
    G.cfg.passwords = d.passwords || DEFAULT_PWS;
    G.cfg.items     = d.items     || DEFAULT_ITEMS;
    G.cfg.courses   = d.courses   || DEFAULT_COURSES;
    G.cfg.seasons   = d.seasons   || DEFAULT_SEASONS;
    G.cfg.defaults  = d.defaults  || DEFAULT_DEFAULTS;
  } else {
    await setDoc('settings', 'config', {
      passwords: DEFAULT_PWS, items: DEFAULT_ITEMS,
      courses: DEFAULT_COURSES, seasons: DEFAULT_SEASONS, defaults: DEFAULT_DEFAULTS
    });
  }
}
async function saveConfig() {
  await setDoc('settings', 'config', G.cfg);
}

/* ═══════════════════════════════════════════════
   데이터 로드
   ═══════════════════════════════════════════════ */
async function loadAll() {
  const [students, dispatches, checkDocs, stockHistDocs] = await Promise.all([
    getDocs('students'),
    getDocs('dispatches'),
    getDocs('stock_checks'),
    getDocs('stock_in_history'),
  ]);
  G.students   = students;
  G.dispatches = dispatches.filter(d => !d.deleted);
  G.stockChecks    = checkDocs;
  G.stockInHistory = stockHistDocs.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  // 전체 재고 = 날짜별 이력 합산
  G.stockIn = {};
  stockHistDocs.forEach(d => {
    if (!G.stockIn[d.item]) G.stockIn[d.item] = {};
    G.stockIn[d.item][d.size] = (G.stockIn[d.item][d.size] || 0) + (d.qty || 0);
  });
  buildDispatchCache();
}

/* ═══════════════════════════════════════════════
   재고 계산
   ═══════════════════════════════════════════════ */
function calcStock() {
  const stock = {};
  const defect = {};
  Object.keys(G.cfg.items).forEach(item => {
    stock[item] = {};
    defect[item] = {};
    G.cfg.items[item].sizes.forEach(sz => {
      stock[item][sz]  = G.stockIn?.[item]?.[sz] || 0;
      defect[item][sz] = 0;
    });
  });
  G.dispatches.forEach(d => {
    if (!stock[d.item]) return;
    if (stock[d.item][d.size] === undefined) stock[d.item][d.size] = 0;
    if (defect[d.item][d.size] === undefined) defect[d.item][d.size] = 0;
    const q = d.qty || 1;
    if (d.type === '출고')         stock[d.item][d.size]  -= q;
    if (d.type === '반품')         stock[d.item][d.size]  += q;
    if (d.type === '반품입고')     stock[d.item][d.size]  += q; // 업로드이력: 재고 플러스
    if (d.type === '교환출고')     stock[d.item][d.size]  -= q;
    if (d.type === '불량입고')     defect[d.item][d.size] += q; // 불량: 재고제외, 불량수량
    if (d.type === '교환반납') {
      if (d.exchangeType === '사이즈교환') stock[d.item][d.size]  += q;
      if (d.exchangeType === '불량')       defect[d.item][d.size] += q;
    }
    // 미수령(재고부족), 출고예약 → 재고 영향 없음
  });
  return { stock, defect };
}

/* ═══════════════════════════════════════════════
   학생 수령 현황
   ═══════════════════════════════════════════════ */
/* ── 출고 캐시 (학생별 미리 그룹화) ── */
let _dispatchCache = null;
let _missingCache  = {};

function buildDispatchCache() {
  _dispatchCache = {};
  _missingCache  = {};
  G.dispatches.forEach(d => {
    if (!_dispatchCache[d.studentId]) _dispatchCache[d.studentId] = [];
    _dispatchCache[d.studentId].push(d);
  });
}

function getStudentReceived(studentId) {
  const received = {};
  Object.keys(G.cfg.items).forEach(item => { received[item] = 0; });
  const myDisp = _dispatchCache?.[studentId] || G.dispatches.filter(d => d.studentId === studentId);
  myDisp.forEach(d => {
    if (received[d.item] === undefined) return;
    if (d.type === '출고' || d.type === '교환출고') received[d.item] += d.qty || 1;
    if (d.type === '반품' || d.type === '반품입고') received[d.item] -= d.qty || 1;
    // 불량입고, 미수령, 출고예약 → 학생 수령에 영향 없음
  });
  received['하의'] = (received['긴바지'] || 0) + (received['반바지'] || 0);
  return received;
}

function getStudentRequired(student) {
  const course = student.course;
  const cfg = G.cfg.courses[course] || {};
  const exc = student.exceptions || {};
  const req = {};
  Object.keys(cfg).forEach(k => {
    const excV = exc[k] || 0;
    req[k] = Math.max(0, (cfg[k] || 0) - excV);
  });
  return req;
}

function getMissingItems(student) {
  if (student.withdrawn) return [];
  if (_missingCache[student.id]) return _missingCache[student.id];
  const received = getStudentReceived(student.id);
  const required = getStudentRequired(student);
  const missing = [];
  Object.keys(required).forEach(k => {
    if (k === '하의_total') {
      if ((received['하의'] || 0) < required[k]) missing.push({ key: k, need: required[k], got: received['하의'] || 0 });
    } else {
      if ((received[k] || 0) < (required[k] || 0)) missing.push({ key: k, need: required[k], got: received[k] || 0 });
    }
  });
  _missingCache[student.id] = missing;
  return missing;
}

let selRoleVal = 'admin';

async function doLogin() {
  const pw = document.getElementById('lpw').value.trim();
  const msgEl = document.getElementById('lmsg');
  const btn = document.getElementById('lbtn');
  msgEl.className = 'lmsg'; msgEl.textContent = '';
  if (!pw) { msgEl.className = 'lmsg err'; msgEl.textContent = '비밀번호를 입력해주세요.'; return; }
  btn.disabled = true; msgEl.className = 'lmsg info'; msgEl.textContent = '연결 중...';
  try {
    await loadConfig();
    const stored = G.cfg.passwords[selRoleVal] || DEFAULT_PWS[selRoleVal];
    if (pw !== stored) {
      msgEl.className = 'lmsg err'; msgEl.textContent = '비밀번호가 올바르지 않습니다.';
      btn.disabled = false; return;
    }
    G.role = selRoleVal;
    msgEl.textContent = '데이터 불러오는 중...';
    await loadAll();
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('roleLabel').textContent = ROLE_LABELS[G.role];
    applyRoleNav();
    renderTab('dashboard');
  } catch(e) {
    msgEl.className = 'lmsg err'; msgEl.textContent = '오류: ' + e.message;
    btn.disabled = false;
  }
}
function doLogout() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('lpw').value = '';
  document.getElementById('lbtn').disabled = false;
  document.getElementById('lmsg').textContent = '';
}
/* 시즌별 품목 순서 고정 헬퍼 */
function getItemsBySeasonOrdered(season) {
  const ORDER = { '동복': ['후드집업','반집업세트'], '하복': ['상의','긴바지','반바지'] };
  const ordered = ORDER[season] || [];
  const fromCfg = Object.keys(G.cfg.items).filter(i => G.cfg.items[i].season === season);
  return [...ordered.filter(i => fromCfg.includes(i)), ...fromCfg.filter(i => !ordered.includes(i))];
}
function applyRoleNav() {
  const vendorHide    = ['dispatch','missing','students','settings'];
  const assistantHide = ['students','settings'];
  if (G.role === 'vendor')    vendorHide.forEach(t    => { const el=document.getElementById(`nav-${t}`); if(el) el.style.display='none'; });
  if (G.role === 'assistant') assistantHide.forEach(t => { const el=document.getElementById(`nav-${t}`); if(el) el.style.display='none'; });
}
function canWrite()   { return G.role === 'admin' || G.role === 'assistant'; }
function isAdmin()    { return G.role === 'admin'; }

function renderVendorView() {
  const { stock, defect } = calcStock();
  // 최신 실재고 맵
  const latestMap = {};
  G.stockChecks.sort((a,b)=>(b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0));
  G.stockChecks.forEach(c => { const k=`${c.item}_${c.size}`; if (!latestMap[k]) latestMap[k]=c; });
  const latestWeek = G.stockChecks[0]?.weekId || '—';

  let seasonBlocks = '';
  ['동복','하복'].forEach(season => {
    const items = Object.entries(G.cfg.items).filter(([,v]) => v.season === season);
    let rows = '';
    items.forEach(([item, cfg]) => {
      cfg.sizes.forEach((sz, si) => {
        const inQty  = G.stockIn?.[item]?.[sz] || 0;
        const actual = latestMap[`${item}_${sz}`]?.actual;
        // 차이 = 입고 - 실재고 (즉, 출고된 것으로 계산)
        const diff   = actual !== undefined ? inQty - actual : null;
        rows += `<tr class="${si===0?'gc':''}">
          ${si===0?`<td class="thd" rowspan="${cfg.sizes.length}" style="text-align:left;font-weight:700">${item}</td>`:''}
          <td>${sz}</td>
          <td style="text-align:center;font-weight:700;color:var(--accent)">${inQty}</td>
          <td style="text-align:center;font-weight:700">${actual !== undefined ? actual : '—'}</td>
          <td style="text-align:center;font-weight:700;color:${diff===null?'#cbd5e1':diff>0?'var(--ok)':diff<0?'var(--err)':'var(--muted)'}">${diff === null ? '—' : diff > 0 ? `+${diff}` : diff}</td>
          <td style="text-align:center;color:var(--err);font-weight:700">${defect[item]?.[sz] > 0 ? defect[item][sz] : '—'}</td>
        </tr>`;
      });
    });
    const sizes = items[0]?.[1]?.sizes || [];
    seasonBlocks += `
      <div class="isec">${season === '동복' ? '🧥' : '👕'} ${season}</div>
      <div class="tw" style="margin-bottom:16px">
        <table class="tb">
          <thead><tr><th>품목</th><th>사이즈</th><th>입고수량</th><th>실재고</th><th>출고 (차이)</th><th>불량</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  });

  document.getElementById('tab-dashboard').innerHTML = `
    <div class="ph">
      <div class="pt">📊 재고 현황</div>
      <div class="ps">입고수량 · 실재고 · 출고 수량 현황 / 실재고 기준: <strong>${latestWeek}</strong></div>
    </div>
    <div class="ibox">📌 입고수량 - 실재고 = 출고(차이) 기준으로 표시됩니다. 실재고는 가장 최근 체크 기준입니다.</div>
    ${seasonBlocks}`;
}

function renderDashboard() {
  if (G.role === 'vendor') { renderVendorView(); return; }
  const { stock, defect } = calcStock();
  const totalDispatches = G.dispatches.filter(d => d.type === '출고').length;
  const totalStudents = G.students.length;
  const missingCount = G.students.filter(s => getMissingItems(s).length > 0).length;
  const pendingCount = G.dispatches.filter(d => d.type === '미수령').length;

  let seasonBlocks = '';
  ['동복','하복'].forEach(season => {
    const items = getItemsBySeasonOrdered(season);
    let itemRows = '';
    items.forEach(item => {
      const cfg = G.cfg.items[item];
      if (!cfg) return;
      const sizes = cfg.sizes;
      const inRow  = sizes.map(sz => `<td>${G.stockIn?.[item]?.[sz] || 0}</td>`).join('');
      const outRow = sizes.map(sz => {
        const out = G.dispatches.filter(d => d.item===item && d.size===sz && d.type==='출고').reduce((s,d)=>s+(d.qty||1),0);
        return `<td>${out}</td>`;
      }).join('');
      const stRow = sizes.map(sz => {
        const s = stock[item]?.[sz] || 0;
        return `<td${s<=0?' class="neg"':s<=5?' style="background:#fef3c7"':''}>${s}</td>`;
      }).join('');
      const defRow = sizes.map(sz => `<td>${defect[item]?.[sz] || 0}</td>`).join('');
      itemRows += `
        <tr class="gc"><td class="thd" rowspan="4" style="text-align:left">${item}</td><td class="thd">입고</td>${inRow}</tr>
        <tr><td class="thd">출고</td>${outRow}</tr>
        <tr><td class="thd" style="color:var(--accent)">재고</td>${stRow}</tr>
        <tr><td class="thd" style="color:var(--err)">불량</td>${defRow}</tr>`;
    });
    const sizes = items.length > 0 ? G.cfg.items[items[0]]?.sizes || [] : [];
    seasonBlocks += `
      <div class="isec">${season === '동복' ? '🧥' : '👕'} ${season}</div>
      <div class="tw" style="margin-bottom:16px">
        <table class="tb">
          <thead><tr><th>품목</th><th>구분</th>${sizes.map(s=>`<th>${s}</th>`).join('')}</tr></thead>
          <tbody>${itemRows}</tbody>
        </table>
      </div>`;
  });

  document.getElementById('tab-dashboard').innerHTML = `
    <div class="ph"><div class="pt">📊 대시보드</div><div class="ps">단체복 입출고 현황 한눈에 보기</div></div>
    <div class="stat-grid">
      <div class="sc"><div class="sc-l">등록 학생</div><div class="sc-v" style="color:var(--accent)">${totalStudents}</div><div class="sc-s">명</div></div>
      <div class="sc"><div class="sc-l">총 출고 건수</div><div class="sc-v">${totalDispatches}</div><div class="sc-s">건</div></div>
      <div class="sc"><div class="sc-l">미수령 학생</div><div class="sc-v" style="color:${missingCount>0?'var(--err)':'var(--ok)'}">${missingCount}</div><div class="sc-s">명</div></div>
      <div class="sc"><div class="sc-l">재고부족 대기</div><div class="sc-v" style="color:${pendingCount>0?'var(--warn)':'var(--ok)'}">${pendingCount}</div><div class="sc-s">건</div></div>
    </div>
    ${seasonBlocks}`;
}

      <input id="dSearch" placeholder="이름 / 수험번호 / 학번 입력..." value="${searchVal}" onkeydown="if(event.key==='Enter')searchDispatch()">
      <button class="btn bp" onclick="searchDispatch()">🔍 검색</button>
    </div>
    <div id="dispatchResult">${resultHtml}</div>`;
}

function searchDispatch() {
  const q = document.getElementById('dSearch').value.trim();
  renderDispatch(q);
}

function selectDispatchStudent(studentId) {
  const s = G.students.find(x => x.id === studentId);
  if (!s) return;
  G.dispatchSearch = s.name;
  G._dispatchStudentId = studentId; // ID 저장
  refreshStudentCard(studentId);
}

// 학생 카드만 새로고침 (ID 우선, 이름 fallback)
function refreshStudentCard(studentIdOrName) {
  const el = document.getElementById('dispatchResult');
  if (!el) { renderDispatch(G.dispatchSearch); return; }
  // ID로 먼저 찾기
  let s = G.students.find(x => x.id === studentIdOrName);
  // 없으면 저장된 ID로 찾기
  if (!s && G._dispatchStudentId) s = G.students.find(x => x.id === G._dispatchStudentId);
  // 마지막 fallback: 이름 (단 1명인 경우만)
  if (!s) {
    const byName = G.students.filter(x => x.name === studentIdOrName);
    if (byName.length === 1) s = byName[0];
  }
  if (s) {
    G._dispatchStudentId = s.id;
    el.innerHTML = buildStudentCard(s);
    const searchEl = document.getElementById('dSearch');
    if (searchEl) searchEl.value = s.name;
  } else {
    renderDispatch(G.dispatchSearch);
  }
}

/* 출고관리 빠른 학생 등록 후 출고 */
async function quickRegisterAndDispatch() {
  const name   = document.getElementById('quick_name')?.value.trim();
  const exam   = document.getElementById('quick_exam')?.value.trim();
  const sno    = document.getElementById('quick_sno')?.value.trim();
  const season = document.getElementById('quick_season')?.value;
  const course = document.getElementById('quick_course')?.value;
  if (!name)   { showToast('이름을 입력해주세요.','w'); return; }
  if (!season) { showToast('시즌을 선택해주세요.','w'); return; }
  if (!course) { showToast('과정을 선택해주세요.','w'); return; }
  const dup = exam && G.students.find(s => s.examNo === exam);
  if (dup) { showToast(`수험번호 ${exam}는 이미 등록된 학생입니다. (${dup.name})`,'w'); return; }
  try {
    const id = await addDoc('students', { name, examNo:exam||'', studentNo:sno||'', course, season, exceptions:{}, memo:'' });
    await loadAll();
    showToast(`${name} 등록 완료! 출고 화면으로 이동합니다.`,'s');
    // 바로 출고 모달 열기
    setTimeout(() => {
      renderDispatch(name);
      setTimeout(() => openDispatchModal(id), 400);
    }, 200);
  } catch(e) { showToast('오류: '+e.message,'e'); }
}

function buildStudentCard(s) {
  const received = getStudentReceived(s.id);
  const required = getStudentRequired(s);
  const missing  = getMissingItems(s);
  const exc = s.exceptions || {};

  // 출고 이력 (학생별)
  const studentDisp = G.dispatches.filter(d => d.studentId === s.id).sort((a,b) => {
    const ta = a.createdAt?.toDate?.()?.getTime() || 0;
    const tb = b.createdAt?.toDate?.()?.getTime() || 0;
    return tb - ta;
  });

  // 동복/하복 구분
  const dongItems = getItemsBySeasonOrdered('동복');
  const haItems   = getItemsBySeasonOrdered('하복');

  function buildHistSection(items) {
    return items.map(item => {
      const rows = studentDisp.filter(d => d.item === item);
      if (rows.length === 0 && !required[item] && item !== '긴바지' && item !== '반바지') return '';
      let reqLabel = '';
      if (item === '긴바지' || item === '반바지') {
        const tot = required['하의_total'] || 0;
        reqLabel = tot > 0 ? `(하의 합계 ${tot}벌 필요)` : '';
      } else {
        reqLabel = required[item] ? `(${required[item]}개 필요)` : '';
      }
      const excLabel = exc[item] ? `<span class="badge bwarn" style="font-size:10px">예외 ${exc[item]}개</span>` : '';
      let rowsHtml = '';
      if (rows.length === 0) {
        rowsHtml = '<tr><td colspan="6" style="color:var(--muted);font-size:11px">기록 없음</td></tr>';
      } else {
        rowsHtml = rows.map(d => {
          const dt = d.createdAt?.toDate?.() ? d.createdAt.toDate().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '—';
          let typeBadge;
          if (d.type==='출고') typeBadge=`<span class="badge bok">출고</span>`;
          else if (d.type==='반품') typeBadge=`<span class="badge berr">반품</span>`;
          else if (d.type==='교환출고') typeBadge=`<span class="badge binfo">교환출고</span>`;
          else if (d.type==='교환반납') typeBadge=`<span class="badge bneu">교환반납(${d.exchangeType})</span>`;
          else if (d.type==='미수령') typeBadge=`<span class="badge bwarn">미수령</span>`;
          else typeBadge=`<span class="badge bneu">${d.type}</span>`;

          const { stock } = calcStock();
          const actionBtns = canWrite() && (d.type==='출고'||d.type==='교환출고') ? `
            <button class="btn bo btn-xs" onclick="openReturnModal('${d.id}')">반품/교환</button>
            ${canWrite()?`<button class="btn be btn-xs" onclick="delDispatch('${d.id}')">출고취소</button>`:''}
          ` : canWrite() && d.type==='미수령' ? (() => {
            const avail = stock[d.item]?.[d.size] || 0;
            return avail > 0
              ? `<button class="btn bs btn-xs" onclick="receivePendingItem('${d.id}','${s.name}')">✓ 수령처리</button>
                 ${canWrite()?`<button class="btn be btn-xs" onclick="delDispatch('${d.id}')">출고취소</button>`:''}`
              : `<span style="font-size:11px;color:var(--err)">재고없음(${avail})</span>
                 ${canWrite()?`<button class="btn be btn-xs" onclick="delDispatch('${d.id}')">출고취소</button>`:''}`;
          })() : (canWrite() && d.type !== '교환반납' ? `<button class="btn be btn-xs" onclick="delDispatch('${d.id}')">출고취소</button>` : '');

          return `<tr>
            <td>${dt}</td>
            <td>${d.size}</td>
            <td>${typeBadge}</td>
            <td>${d.qty||1}</td>
            <td style="font-size:11px;color:var(--muted)">${d.note||''}</td>
            <td>${actionBtns}</td>
          </tr>`;
        }).join('');
      }
      return `
        <div class="hist-item-group">
          <div class="hist-item-label">${item} ${reqLabel} ${excLabel}</div>
          <div class="tw"><table class="tb">
            <thead><tr><th>일시</th><th>사이즈</th><th>구분</th><th>수량</th><th>비고</th><th>액션</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table></div>
        </div>`;
    }).join('');
  }

  const withdrawnBadge = s.isTemporaryException
    ? `<span class="withdrawn-tag" style="background:#fde8ff;color:#7c3aed;border-color:#e9d5ff">📋 일시예외처리</span>`
    : s.withdrawn
      ? `<span class="withdrawn-tag">🚪 퇴소${s.withdrawnDate ? ` (${s.withdrawnDate})` : ''}</span>`
      : `<span style="font-size:11px;color:var(--ok);font-weight:600">✓ 재원</span>`;

  const missBadge = s.withdrawn
    ? `<span class="badge bneu">🚪 퇴소</span>`
    : missing.length > 0
      ? `<span class="badge berr">${missing.map(m=>m.key.replace('하의_total','하의')).join(', ')} 미수령</span>`
      : `<span class="badge bok">수령완료</span>`;

  // 예외처리 사유 표시
  const excEntries = Object.entries(s.exceptions||{}).filter(([,v])=>v>0);
  const excBadges = excEntries.map(([k,v]) => {
    const reason = (s.exceptionReasons||{})[k] || '';
    return `<span class="exc-reason-badge tip-wrap">${k.replace('하의_total','하의')} ${v}개 예외
      ${reason ? `<span class="tip-box">사유: ${reason}</span>` : ''}</span>`;
  }).join(' ');

  return `
    <div class="stu-card">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px">
        <div>
          <div class="stu-name">${s.name} ${missBadge} ${withdrawnBadge}</div>
          <div class="stu-meta">수험번호: ${s.examNo||'—'} | 학번: ${s.studentNo||'—'} | 과정: <strong>${s.course||'—'}</strong>${s.season ? ` | 시즌: ${s.season}년` : ''}</div>
          ${excBadges ? `<div style="margin-top:5px;display:flex;gap:4px;flex-wrap:wrap">${excBadges}</div>` : ''}
          ${s.memo ? `<div style="margin-top:5px;padding:6px 10px;background:var(--info-bg);border-radius:7px;font-size:12px;color:var(--info)">📝 ${s.memo}</div>` : ''}
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${canWrite() && !s.withdrawn ? `<button class="btn bp btn-sm" onclick="openDispatchModal('${s.id}')">📤 출고하기</button>` : ''}
          ${isAdmin() ? `<button class="btn bo btn-sm" onclick="openExceptionModal('${s.id}')">예외처리</button>` : ''}
          ${isAdmin() ? `<button class="btn bo btn-sm" onclick="openMemoModal('${s.id}')">📝 메모</button>` : ''}
          ${isAdmin() && !s.withdrawn ? `<button class="btn bw btn-sm" onclick="openWithdrawModal('${s.id}')">🚪 퇴소</button>` : ''}
          ${isAdmin() && s.withdrawn  ? `<button class="btn bo btn-sm" onclick="unmarkWithdrawn('${s.id}')">↩ 재원복귀</button>` : ''}
        </div>
      </div>
      <hr style="margin:12px 0;border:none;border-top:1px solid var(--bdr)">
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:10px">🧥 동복 출고 내역</div>
      ${buildHistSection(dongItems)}
      <div style="font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 10px">👕 하복 출고 내역</div>
      ${buildHistSection(haItems)}
    </div>`;
}

/* ═══════════════════════════════════════════════
   출고 모달
   ═══════════════════════════════════════════════ */
function openDispatchModal(studentId) {
  const student = G.students.find(s => s.id === studentId);
  if (!student) return;
  G.dmStudent = student;
  const { stock } = calcStock();
  document.getElementById('dm-title').textContent = `출고하기 — ${student.name} (${student.course})`;

  const dongItems = getItemsBySeasonOrdered('동복');
  const haItems   = getItemsBySeasonOrdered('하복');

  function buildItemRows(items) {
    return items.map(item => {
      const sizes = G.cfg.items[item].sizes;
      const sizeOpts = sizes.map(sz => {
        const s = stock[item]?.[sz] || 0;
        const lbl = s <= 0 ? `${sz} (재고없음)` : s <= 3 ? `${sz} (잔여${s})` : `${sz} (${s})`;
        return `<option value="${sz}" ${s<=0?'':''}>${lbl}</option>`;
      }).join('');
      const curStock = stock[item]?.[sizes[0]] || 0;
      return `
        <div class="ditem-row">
          <div class="ditem-name">${item}</div>
          <select id="dm_sz_${item}" style="min-width:130px;padding:6px 10px;border:2px solid var(--bdr);border-radius:7px;font-family:var(--font);font-size:12px;outline:none" onchange="updateDmStock('${item}',this)">${sizeOpts}</select>
          <span class="ditem-stock ${curStock<=0?'stock-low':curStock<=3?'stock-warn':'stock-ok'}" id="dm_stk_${item}">재고 ${curStock}</span>
          <input type="number" min="0" max="99" value="0" id="dm_qty_${item}" style="width:60px;padding:6px;border:2px solid var(--bdr);border-radius:7px;text-align:center;font-family:var(--font);font-size:12px;outline:none">
          <label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer">
            <input type="checkbox" id="dm_pend_${item}"> <span style="color:var(--warn)">재고없어 미수령</span>
          </label>
        </div>`;
    }).join('');
  }

  document.getElementById('dm-body').innerHTML = `
    <div class="ibox">💡 수량 0은 출고되지 않습니다. 재고가 없으면 "재고없어 미수령"을 체크하세요.</div>
    <div class="ditem-section">
      <div class="ditem-title">🧥 동복</div>
      ${buildItemRows(dongItems)}
    </div>
    <div class="ditem-section">
      <div class="ditem-title">👕 하복</div>
      ${buildItemRows(haItems)}
    </div>
    <div class="fg" style="margin-top:12px">
      <label>비고 (선택)</label>
      <input type="text" id="dm_note" placeholder="특이사항 입력...">
    </div>`;

  openModal('dispatchModal');
}

function updateDmStock(item, sel) {
  const { stock } = calcStock();
  const sz = sel.value;
  const s = stock[item]?.[sz] || 0;
  const el = document.getElementById(`dm_stk_${item}`);
  if (el) { el.textContent = `재고 ${s}`; el.className = `ditem-stock ${s<=0?'stock-low':s<=3?'stock-warn':'stock-ok'}`; }
}

async function confirmDispatch() {
  if (!G.dmStudent) return;
  const note = document.getElementById('dm_note').value;
  const items = Object.keys(G.cfg.items);
  const { stock } = calcStock();
  const records = [];

  for (const item of items) {
    const qty   = parseInt(document.getElementById(`dm_qty_${item}`)?.value) || 0;
    const sz    = document.getElementById(`dm_sz_${item}`)?.value;
    const pend  = document.getElementById(`dm_pend_${item}`)?.checked;
    if (qty === 0 && !pend) continue;

    if (pend) {
      records.push({ type: '미수령', item, size: sz, qty: 1 });
    } else {
      const avail = stock[item]?.[sz] || 0;
      if (avail < qty) {
        showToast(`${item} ${sz} 재고 부족! (현재 ${avail}개)`, 'e');
        return;
      }
      records.push({ type: '출고', item, size: sz, qty });
    }
  }

  if (records.length === 0) { showToast('출고할 항목이 없습니다.', 'w'); return; }

  try {
    for (const r of records) {
      await addDoc('dispatches', {
        studentId: G.dmStudent.id,
        studentName: G.dmStudent.name,
        examNo: G.dmStudent.examNo,
        course: G.dmStudent.course,
        ...r, note,
        createdBy: G.role, deleted: false
      });
    }
    await loadAll();
    closeModal('dispatchModal');
    showToast(`${G.dmStudent.name} 출고 완료`, 's');
    G.dispatchSearch = G.dmStudent.name;
    G._dispatchStudentId = G.dmStudent.id;
    refreshStudentCard(G.dmStudent.id);
  } catch(e) { showToast('저장 오류: '+e.message, 'e'); }
}

/* ═══════════════════════════════════════════════
   출고 삭제
   ═══════════════════════════════════════════════ */
async function delDispatch(id, studentId) {
  const d = G.dispatches.find(x => x.id === id);
  if (!d) return;
  const maxQty   = d.qty || 1;
  const targetId = studentId || d.studentId || G._dispatchStudentId;
  const typeLabel = d.type === '출고' ? '출고취소' : d.type === '미수령' ? '미수령취소' : '삭제';

  if (maxQty > 1 && (d.type === '출고' || d.type === '교환출고')) {
    const input = prompt(d.item + ' ' + d.size + ' 출고취소\n취소할 수량을 입력하세요 (1~' + maxQty + '개)', maxQty);
    if (input === null) return;
    const qty = parseInt(input);
    if (isNaN(qty) || qty < 1 || qty > maxQty) { showToast('1~' + maxQty + ' 사이의 수량을 입력해주세요.', 'w'); return; }
    if (!confirm(d.studentName + ' — ' + d.item + ' ' + d.size + ' ' + qty + '개 출고취소하시겠습니까?')) return;
    try {
      if (qty === maxQty) {
        await updateDoc('dispatches', id, { deleted: true, deletedAt: firebase.firestore.FieldValue.serverTimestamp() });
      } else {
        await updateDoc('dispatches', id, { qty: maxQty - qty });
        await addDoc('dispatches', {
          studentId: d.studentId, studentName: d.studentName, examNo: d.examNo, course: d.course,
          item: d.item, size: d.size, qty: qty, type: '반품', note: '출고취소(부분)',
          refId: id, createdBy: G.role, deleted: false
        });
      }
      await loadAll();
      showToast(qty + '개 출고취소 완료 — 재고 복원됨', 's');
      if (G.activeTab === 'dispatch') { G._dispatchStudentId = targetId; refreshStudentCard(targetId); }
      if (G.activeTab === 'missing') renderMissing();
    } catch(e) { showToast('오류: ' + e.message, 'e'); }
    return;
  }

  const msg = d.type === '출고'
    ? '⚠ ' + d.studentName + ' — ' + d.item + ' ' + d.size + ' 출고를 취소하시겠습니까?\n취소하면 재고가 즉시 복원됩니다.'
    : '이 기록을 삭제하시겠습니까? 재고에 즉시 반영됩니다.';
  if (!confirm(msg)) return;
  try {
    await updateDoc('dispatches', id, { deleted: true, deletedAt: firebase.firestore.FieldValue.serverTimestamp() });
    await loadAll();
    showToast(typeLabel + ' 완료 — 재고 복원됨', 's');
    if (G.activeTab === 'dispatch') {
      G.dispatchSearch = d.studentName || G.dispatchSearch;
      G._dispatchStudentId = targetId;
      refreshStudentCard(targetId);
    }
    if (G.activeTab === 'missing') renderMissing();
  } catch(e) { showToast('오류: ' + e.message, 'e'); }
}

/* ═══════════════════════════════════════════════
   미수령 관리
   ═══════════════════════════════════════════════ */
let missingTabSel = 'unvisited';
let missingSearch = '';
function selMissingTab(t) { missingTabSel = t; missingSearch = ''; renderMissing(); }
function filterBySearch(list) {
  if (!missingSearch) return list;
  const q = missingSearch.toLowerCase();
  return list.filter(s => (s.name||'').toLowerCase().includes(q) || (s.examNo||'').includes(q) || (s.studentNo||'').includes(q));
}
function missingSearchBar() {
  return '<div style="margin-bottom:10px"><input type="text" id="missingSearchInp" value="'+missingSearch+'" placeholder="🔍 이름 또는 수험번호 검색..." oninput="missingSearch=this.value;filterMissingRows()" style="width:100%;max-width:320px;padding:8px 12px;border:2px solid var(--bdr);border-radius:9px;font-family:var(--font);font-size:12px;outline:none;box-sizing:border-box"></div>';
}

function filterMissingRows() {
  missingSearch = document.getElementById('missingSearchInp')?.value || '';
  // 전체 재렌더 대신 행만 필터링
  const rows = document.querySelectorAll('#tab-missing table tbody tr');
  const q = missingSearch.toLowerCase();
  rows.forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
}
function renderMissing() {
  const el = document.getElementById('tab-missing');
  const pendingStudentIds = new Set(G.dispatches.filter(d=>d.type==='미수령').map(d=>d.studentId));

  const stockShortStudents = G.students.filter(s => pendingStudentIds.has(s.id));

  const unvisitedStudents = G.students.filter(s => {
    if (s.withdrawn) return false;
    if (pendingStudentIds.has(s.id)) return false;
    const missing = getMissingItems(s);
    if (missing.length === 0) return false;
    return !G.dispatches.some(d => d.studentId===s.id && (d.type==='출고'||d.type==='교환출고'));
  });

  const partialStudents = G.students.filter(s => {
    if (s.withdrawn) return false;
    if (pendingStudentIds.has(s.id)) return false;
    const missing = getMissingItems(s);
    if (missing.length === 0) return false;
    return G.dispatches.some(d => d.studentId===s.id && (d.type==='출고'||d.type==='교환출고'));
  });

  const excStudents = G.students.filter(s => s.exceptions && Object.values(s.exceptions).some(v=>v>0));

  function examCell(s) {
    return `<td><span class="exam-click" onclick="openMissingMemoModal('${s.id}')" title="클릭 시 메모">${s.examNo||'—'}</span></td>`;
  }
  function wBtn(s) {
    return isAdmin() && !s.withdrawn ? `<button class="btn bw btn-xs" onclick="openWithdrawModal('${s.id}')">🚪 퇴소</button>` : '';
  }
  function goDispatch(name) {
    return `onclick="switchTab('dispatch');setTimeout(()=>{G.dispatchSearch='${name}';renderDispatch('${name}')},100)"`;
  }

  let bodyHtml;

  function mkExcBtn(sid) { return isAdmin() ? '<button class="btn bo btn-xs" onclick="openExceptionModal(&quot;'+sid+'&quot;)">예외처리</button>' : ''; }

  if (missingTabSel === 'unvisited') {
    const filtered = filterBySearch(unvisitedStudents);
    let rows = filtered.map(s => {
      const miss = getMissingItems(s);
      const mStr = miss.map(m => m.key.replace('하의_total','하의')+'('+m.got+'/'+m.need+')').join(', ');
      return '<tr><td class="tleft"><strong>'+s.name+'</strong>'+(s.memo?' 📝':'')+
        '</td>'+examCell(s)+'<td>'+(s.studentNo||'—')+'</td><td>'+(s.course||'—')+'</td>'+
        '<td style="text-align:left"><span class="badge berr">'+mStr+'</span></td>'+
        '<td style="display:flex;gap:4px;flex-wrap:wrap">'+mkExcBtn(s.id)+
        '<button class="btn bo btn-xs" '+goDispatch(s.name)+'>출고</button>'+wBtn(s)+'</td></tr>';
    }).join('');
    bodyHtml = missingSearchBar()+(filtered.length===0
      ?'<div class="notice">'+(missingSearch?'검색 결과 없음':'미방문 미수령 학생이 없습니다. ✅')+'</div>'
      :'<div class="sec-hd"><span style="font-size:12px;color:var(--muted)">'+filtered.length+'명</span><button class="btn bo btn-sm" onclick="exportMissingList(\'unvisited\')">📥 엑셀</button></div><div class="tw"><table class="tb"><thead><tr><th>이름</th><th>수험번호(클릭=메모)</th><th>학번</th><th>과정</th><th>미수령항목</th><th>액션</th></tr></thead><tbody>'+rows+'</tbody></table></div>');

  } else if (missingTabSel === 'partial') {
    const filtered = filterBySearch(partialStudents);
    let rows = filtered.map(s => {
      const miss = getMissingItems(s);
      const mStr = miss.map(m => m.key.replace('하의_total','하의')+'('+m.got+'/'+m.need+')').join(', ');
      const excStr = Object.entries(s.exceptions||{}).filter(([,v])=>v>0).map(([k,v])=>{
        const r=(s.exceptionReasons||{})[k]||'';
        return '<span class="tip-wrap exc-reason-badge">'+k.replace('하의_total','하의')+' '+v+'개 예외'+(r?'<span class="tip-box">사유: '+r+'</span>':'')+'</span>';
      }).join(' ');
      return '<tr><td class="tleft"><strong>'+s.name+'</strong>'+(s.memo?' 📝':'')+
        '</td>'+examCell(s)+'<td>'+(s.course||'—')+'</td>'+
        '<td style="text-align:left"><span class="badge badge-partial">'+mStr+'</span>'+(excStr?'<div style="margin-top:3px">'+excStr+'</div>':'')+
        '</td><td style="display:flex;gap:4px;flex-wrap:wrap">'+mkExcBtn(s.id)+
        '<button class="btn bo btn-xs" '+goDispatch(s.name)+'>출고</button>'+wBtn(s)+'</td></tr>';
    }).join('');
    bodyHtml = missingSearchBar()+'<div class="ibox">📋 일부는 수령했지만 아직 받지 못한 항목이 있는 학생입니다.</div>'
      +(filtered.length===0
        ?'<div class="notice">'+(missingSearch?'검색 결과 없음':'부분수령 학생이 없습니다. ✅')+'</div>'
        :'<div class="sec-hd"><span style="font-size:12px;color:var(--muted)">'+filtered.length+'명</span><button class="btn bo btn-sm" onclick="exportMissingList(\'partial\')">📥 엑셀</button></div><div class="tw"><table class="tb"><thead><tr><th>이름</th><th>수험번호(클릭=메모)</th><th>과정</th><th>미수령항목</th><th>액션</th></tr></thead><tbody>'+rows+'</tbody></table></div>');

  } else if (missingTabSel === 'shortage') {
    const { stock } = calcStock();
    const filtered = filterBySearch(stockShortStudents);
    let rows = filtered.map(s => {
      const pends = G.dispatches.filter(d=>d.studentId===s.id&&d.type==='미수령');
      const itemBtns = pends.map(p=>{
        const avail=stock[p.item]?.[p.size]||0;
        return avail>0
          ?'<button class="btn bs btn-xs" style="margin:2px" onclick="receivePendingItem(\''+p.id+'\'  ,\''+s.name+'\')">✓ '+p.item+' '+p.size+'</button>'
          :'<span class="badge bwarn" style="margin:2px">'+p.item+' '+p.size+'(재고없음)</span>';
      }).join('');
      return '<tr><td class="tleft"><strong>'+s.name+'</strong>'+(s.memo?' 📝':'')+
        '</td>'+examCell(s)+'<td>'+(s.course||'—')+'</td>'+
        '<td style="text-align:left">'+itemBtns+'</td>'+
        '<td style="display:flex;gap:4px;flex-wrap:wrap">'+
        '<button class="btn bs btn-xs" onclick="convertPendingToDispatch(\''+s.id+'\')">전체수령</button>'+
        '<button class="btn bo btn-xs" '+goDispatch(s.name)+'>조회</button>'+
        (isAdmin()?'<button class="btn bo btn-xs" onclick="cancelPending(\''+s.id+'\')">취소</button>':'')+
        wBtn(s)+'</td></tr>';
    }).join('');
    bodyHtml = missingSearchBar()+(filtered.length===0
      ?'<div class="notice">'+(missingSearch?'검색 결과 없음':'재고부족 미수령이 없습니다. ✅')+'</div>'
      :'<div class="sec-hd"><span style="font-size:12px;color:var(--muted)">'+filtered.length+'명</span><button class="btn bo btn-sm" onclick="exportMissingList(\'shortage\')">📥 엑셀</button></div><div class="tw"><table class="tb"><thead><tr><th>이름</th><th>수험번호(클릭=메모)</th><th>과정</th><th>재고부족항목</th><th>액션</th></tr></thead><tbody>'+rows+'</tbody></table></div>');

  } else {
    const filtered = filterBySearch(excStudents);
    let rows = filtered.map(s => {
      const reasons=s.exceptionReasons||{};
      const excStr=Object.entries(s.exceptions||{}).filter(([,v])=>v>0).map(([k,v])=>{
        const r=reasons[k]||'';
        return '<span class="tip-wrap exc-reason-badge">'+k.replace('하의_total','하의')+' '+v+'개'+(r?'<span class="tip-box">사유: '+r+'</span>':'')+'</span>';
      }).join(' ');
      return '<tr><td class="tleft"><strong>'+s.name+'</strong></td>'+
        examCell(s)+'<td>'+(s.course||'—')+'</td>'+
        '<td style="text-align:left">'+excStr+'</td>'+
        '<td>'+(isAdmin()?'<button class="btn bo btn-xs" onclick="openExceptionModal(\''+s.id+'\')">수정</button>':'—')+'</td></tr>';
    }).join('');
    bodyHtml = missingSearchBar()+(filtered.length===0
      ?'<div class="notice">'+(missingSearch?'검색 결과 없음':'예외처리된 학생이 없습니다.')+'</div>'
      :'<div class="sec-hd"><span style="font-size:12px;color:var(--muted)">'+filtered.length+'명</span><button class="btn bo btn-sm" onclick="exportMissingList(\'exception\')">📥 엑셀</button></div><div class="tw"><table class="tb"><thead><tr><th>이름</th><th>수험번호(클릭=메모)</th><th>과정</th><th>예외처리내용</th><th>액션</th></tr></thead><tbody>'+rows+'</tbody></table></div>');
  }
  el.innerHTML = `
    <div class="ph"><div class="pt">⚠️ 미수령 관리</div><div class="ps">미수령 학생 현황 및 예외처리</div></div>
    <div class="stat-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:12px">
      <div class="sc"><div class="sc-l">미방문</div><div class="sc-v" style="color:var(--err)">${unvisitedStudents.length}</div><div class="sc-s">명</div></div>
      <div class="sc"><div class="sc-l">부분수령</div><div class="sc-v" style="color:#7c3aed">${partialStudents.length}</div><div class="sc-s">명</div></div>
      <div class="sc"><div class="sc-l">재고부족</div><div class="sc-v" style="color:var(--warn)">${stockShortStudents.length}</div><div class="sc-s">명</div></div>
      <div class="sc"><div class="sc-l">예외처리</div><div class="sc-v" style="color:var(--accent)">${excStudents.length}</div><div class="sc-s">명</div></div>
      <div class="sc"><div class="sc-l">퇴소</div><div class="sc-v" style="color:var(--warn)">${G.students.filter(s=>s.withdrawn&&!s.isTemporaryException).length}</div><div class="sc-s">명</div></div>
    </div>
    <div class="card">

        <button class="ttab ${missingTabSel==='partial'?'active':''}"   onclick="selMissingTab('partial')">부분수령 (${partialStudents.length})</button>
        <button class="ttab ${missingTabSel==='shortage'?'active':''}"  onclick="selMissingTab('shortage')">재고부족 (${stockShortStudents.length})</button>
        <button class="ttab ${missingTabSel==='exception'?'active':''}" onclick="selMissingTab('exception')">예외처리 (${excStudents.length})</button>
      </div>
      ${bodyHtml}
    </div>`;
}

/* 미수령 목록 엑셀 다운로드 */
function exportMissingList(type) {
  const pendingStudentIds = new Set(G.dispatches.filter(d=>d.type==='미수령').map(d=>d.studentId));
  let rows = [], filename = '';

  if (type === 'unvisited') {
    filename = '미방문미수령';
    G.students.filter(s => !s.withdrawn && !pendingStudentIds.has(s.id) && getMissingItems(s).length > 0 &&
      !G.dispatches.some(d=>d.studentId===s.id&&(d.type==='출고'||d.type==='교환출고'))
    ).forEach(s => {
      const missing = getMissingItems(s);
      rows.push({ '이름':s.name,'수험번호':s.examNo||'','학번':s.studentNo||'','과정':s.course||'','시즌':s.season||'',
        '미수령항목':missing.map(m=>`${m.key.replace('하의_total','하의')}(${m.got}/${m.need})`).join(', '),
        '메모':s.memo||'' });
    });
  } else if (type === 'partial') {
    filename = '부분수령';
    G.students.filter(s => !s.withdrawn && !pendingStudentIds.has(s.id) && getMissingItems(s).length > 0 &&
      G.dispatches.some(d=>d.studentId===s.id&&(d.type==='출고'||d.type==='교환출고'))
    ).forEach(s => {
      const missing = getMissingItems(s);
      rows.push({ '이름':s.name,'수험번호':s.examNo||'','학번':s.studentNo||'','과정':s.course||'','시즌':s.season||'',
        '미수령항목':missing.map(m=>`${m.key.replace('하의_total','하의')}(${m.got}/${m.need})`).join(', '),
        '메모':s.memo||'' });
    });
  } else if (type === 'shortage') {
    filename = '재고부족대기';
    G.students.filter(s=>pendingStudentIds.has(s.id)).forEach(s => {
      const pendings = G.dispatches.filter(d=>d.studentId===s.id&&d.type==='미수령');
      pendings.forEach(p => {
        rows.push({'이름':s.name,'수험번호':s.examNo||'','학번':s.studentNo||'','과정':s.course||'','시즌':s.season||'',
          '품목':p.item,'사이즈':p.size,'수량':p.qty||1,'메모':s.memo||''});
      });
    });
  } else {
    filename = '예외처리목록';
    G.students.filter(s=>s.exceptions&&Object.values(s.exceptions).some(v=>v>0)).forEach(s => {
      const exc=s.exceptions||{}, reasons=s.exceptionReasons||{};
      rows.push({'이름':s.name,'수험번호':s.examNo||'','과정':s.course||'','시즌':s.season||'',
        '예외처리내용':Object.entries(exc).filter(([,v])=>v>0).map(([k,v])=>`${k} ${v}개`).join(', '),
        '사유':Object.entries(exc).filter(([,v])=>v>0).map(([k])=>reasons[k]||'').join(', ')});
    });
  }

  if (rows.length === 0) { showToast('다운로드할 데이터가 없습니다.', 'w'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, filename);
  XLSX.writeFile(wb, `QUETTA_${filename}_${new Date().toLocaleDateString('ko-KR').replace(/\./g,'').replace(/ /g,'')}.xlsx`);
}

async function saveMemo() {
  if (!G.memoStudent) return;
  const memo = document.getElementById('mm_text')?.value || '';
  try {
    await updateDoc('students', G.memoStudent.id, { memo });
    await loadAll();
    closeModal('memoModal');
    showToast('메모 저장됨', 's');
    if (G.activeTab==='missing') renderMissing();
    if (G.activeTab==='dispatch') { G.dispatchSearch = G.dispatchSearch||G.memoStudent.name; refreshStudentCard(G.dispatchSearch); }
    if (G.activeTab==='students') renderStudents();
  } catch(e) { showToast('오류: '+e.message,'e'); }
}

async function receivePendingItem(dispatchId, studentName) {
  const d = G.dispatches.find(x => x.id === dispatchId);
  if (!d) return;
  const { stock } = calcStock();
  const avail = stock[d.item]?.[d.size] || 0;
  if (avail < (d.qty||1)) {
    showToast(`${d.item} ${d.size} 재고 부족 (현재 ${avail}개)`, 'e');
    return;
  }
  try {
    await updateDoc('dispatches', dispatchId, { deleted: true, deletedAt: firebase.firestore.Timestamp.now() });
    await addDoc('dispatches', {
      studentId: d.studentId,
      studentName: d.studentName,
      examNo: d.examNo || '',
      course: d.course || '',
      item: d.item,
      size: d.size,
      qty: d.qty || 1,
      type: '출고',
      note: '재고입고 후 수령',
      createdBy: G.role,
      deleted: false,
    });
    await loadAll();
    showToast(`${studentName} — ${d.item} ${d.size} 수령 완료 ✓`, 's');
    // 현재 탭에 따라 화면 갱신
    if (G.activeTab === 'dispatch') { G.dispatchSearch = studentName; refreshStudentCard(studentName); }
    else if (G.activeTab === 'missing') renderMissing();
  } catch(e) { showToast('오류: '+e.message,'e'); }
}

async function convertPendingToDispatch(studentId) {
  const pendings = G.dispatches.filter(d => d.studentId === studentId && d.type === '미수령');
  const { stock } = calcStock();
  for (const p of pendings) {
    const avail = stock[p.item]?.[p.size] || 0;
    if (avail < 1) { showToast(`${p.item} ${p.size} 재고 부족`, 'w'); continue; }
    await addDoc('dispatches', { ...p, id: undefined, type: '출고', createdAt: undefined });
    await updateDoc('dispatches', p.id, { deleted: true, deletedAt: firebase.firestore.FieldValue.serverTimestamp() });
  }
  await loadAll();
  showToast('출고 처리 완료', 's');
  renderMissing();
}
async function cancelPending(studentId) {
  if (!confirm('재고부족 미수령 기록을 취소하시겠습니까?')) return;
  const pendings = G.dispatches.filter(d => d.studentId === studentId && d.type === '미수령');
  for (const p of pendings) {
    await updateDoc('dispatches', p.id, { deleted: true });
  }
  await loadAll();
  showToast('미수령 취소됨');
  renderMissing();
}

/* ═══════════════════════════════════════════════
   예외처리 모달
   ═══════════════════════════════════════════════ */
function openExceptionModal(studentId) {
  const student = G.students.find(s => s.id === studentId);
  if (!student) return;
  G.emStudent = student;
  const exc = student.exceptions || {};
  const reasons = student.exceptionReasons || {};
  const courses = G.cfg.courses[student.course] || {};

  let rows = Object.entries(courses).map(([k, v]) => {
    const label = k === '하의_total' ? '하의 합계' : k;
    const cur = exc[k] || 0;
    const reason = reasons[k] || '';
    return `
      <div class="ditem-row" style="flex-direction:column;align-items:stretch;gap:8px">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="ditem-name">${label}</div>
          <div style="font-size:11px;color:var(--muted)">필요: ${v}개</div>
          <div class="fg" style="flex:1">
            <label>예외처리 수량 (0~${v})</label>
            <input type="number" min="0" max="${v}" value="${cur}" id="exc_${k}" style="width:80px;padding:6px;border:2px solid var(--bdr);border-radius:7px;text-align:center;font-family:var(--font);font-size:13px;outline:none">
          </div>
        </div>
        <div class="fg">
          <label>사유 (선택)</label>
          <input type="text" id="excr_${k}" value="${reason}" placeholder="예외처리 사유 입력..." style="padding:7px 10px;border:2px solid var(--bdr);border-radius:7px;font-family:var(--font);font-size:12px;outline:none">
        </div>
      </div>`;
  }).join('');

  document.getElementById('em-body').innerHTML = `
    <div style="margin-bottom:14px">
      <strong>${student.name}</strong> (${student.course}) — 예외처리 설정<br>
      <span style="font-size:11px;color:var(--muted)">0 = 예외 없음 | 사유 입력 시 출고관리에서 툴팁으로 확인 가능</span>
    </div>
    ${rows}`;
  openModal('exceptionModal');
}

async function confirmException() {
  if (!G.emStudent) return;
  const courses = G.cfg.courses[G.emStudent.course] || {};
  const exceptions = {}, exceptionReasons = {};
  Object.keys(courses).forEach(k => {
    const v = parseInt(document.getElementById(`exc_${k}`)?.value) || 0;
    const r = document.getElementById(`excr_${k}`)?.value.trim() || '';
    if (v > 0) { exceptions[k] = v; exceptionReasons[k] = r; }
  });
  try {
    await updateDoc('students', G.emStudent.id, { exceptions, exceptionReasons });
    await loadAll();
    closeModal('exceptionModal');
    showToast('예외처리 저장됨', 's');
    if (G.activeTab === 'missing') renderMissing();
    if (G.activeTab === 'dispatch') { G.dispatchSearch = G.emStudent.name; refreshStudentCard(G.emStudent.name); }
  } catch(e) { showToast('오류: '+e.message,'e'); }
}

          </div>
          <div class="fg">
            <label>입고 시간 *</label>

              ${hourOpts}

        const vNote  = ex ? (ex.note || '') : '';

    bodyHtml = '<div class="ibox">📋 재고 조사 일시를 입력하면 <strong>해당 시각 기준 시스템재고</strong>와 비교합니다.<br>실재고 = 창고 + 교판실 + 샘플 + 불량 | 시스템재고는 불량 포함</div>'+

        '<thead><tr>'+
          '<th rowspan="2">품목</th><th rowspan="2">사이즈</th>'+
          '<th colspan="4" style="background:#f0f9ff;color:#0369a1">실재고 입력</th>'+
          '<th rowspan="2" style="background:#f0fdf4;color:var(--ok)">실재고합계</th>'+

      <div class="sec-hd">

            <th rowspan="2" style="background:#fff1f2;color:var(--err)">불량재고</th>
            <th rowspan="2">차이</th><th rowspan="2">비고</th>
          </tr>
          <tr>
            <th style="background:#f0f9ff">창고</th><th style="background:#f0f9ff">교판실</th>
            <th style="background:#f0f9ff">샘플</th><th style="background:#f0f9ff">불량</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table></div>`;



  } else {
    // 최신 비교현황
    const latestMap = {};
    G.stockChecks.sort((a,b)=>(b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0));
    G.stockChecks.forEach(c => { const k=`${c.item}_${c.size}`; if (!latestMap[k]) latestMap[k]=c; });

    Object.entries(G.cfg.items).forEach(([item, cfg]) => {
      cfg.sizes.forEach((sz, si) => {

function getWeekId() {
  const d = new Date();
  const day = d.getDay() || 7;
  d.setDate(d.getDate() + 4 - day);
  const ys = new Date(d.getFullYear(), 0, 1);
  const wk = Math.ceil(((d - ys) / 86400000 + 1) / 7);
  return `${d.getFullYear()}-W${String(wk).padStart(2,'0')}`;
}

/* ── 실재고 체크 합계 실시간 계산 ── */
function calcCheckSum(el) {
  // el의 id에서 타입_품목_사이즈 추출 (예: chk_창고_후드집업_M)
  const parts = el.id.split('_');
  // parts[0]=chk, parts[1]=타입, parts[2..n-1]=item, parts[n]=size
  const sz   = parts[parts.length - 1];
  const type = parts[1];
  const item = parts.slice(2, parts.length - 1).join('_');

  const창고  = parseInt(document.getElementById('chk_창고_'  + item + '_' + sz)?.value)||0;
  const교판실 = parseInt(document.getElementById('chk_교판실_' + item + '_' + sz)?.value)||0;
  const샘플  = parseInt(document.getElementById('chk_샘플_'  + item + '_' + sz)?.value)||0;
  const불량  = parseInt(document.getElementById('chk_불량_'  + item + '_' + sz)?.value)||0;
  const sum  = 창고 + 교판실 + 샘플 + 불량;

  const sysEl  = document.getElementById('chksys_'  + item + '_' + sz);
  const sumEl  = document.getElementById('chksum_'  + item + '_' + sz);
  const diffEl = document.getElementById('chkdiff_' + item + '_' + sz);
  const sysTotal = sysEl ? parseInt(sysEl.dataset.sys || 0) : 0;

  if (sumEl)  sumEl.textContent = sum;
  if (diffEl) {
    const d = sum - sysTotal;
    diffEl.innerHTML = d===0
      ? '<span style="color:var(--ok)">✓</span>'
      : d>0
        ? '<span class="pos">+' + d + '</span>'
        : '<span class="neg">' + d + '</span>';
  }
}

/* ── 지정 일시 기준 시스템 재고 계산 ── */
function calcStockAtTime(targetDate, targetHour) {
  const cutoff = new Date(`${targetDate}T${String(targetHour).padStart(2,'0')}:59:59`);

  // 입고: 해당 날짜+시간 이전까지 (hour 있으면 시간 비교, 없으면 날짜만)
  const stockIn = {};
  (G.stockInHistory || []).forEach(h => {
    if (!h.date) return;
    const hHour = h.hour !== undefined ? h.hour : 0;
    const inRange = h.date < targetDate || (h.date === targetDate && hHour <= targetHour);
    if (!inRange) return;
    if (!stockIn[h.item]) stockIn[h.item] = {};
    stockIn[h.item][h.size] = (stockIn[h.item][h.size]||0) + (h.qty||0);
  });

  const stock = {}, defect = {};
  Object.keys(G.cfg.items).forEach(item => {
    stock[item] = {}; defect[item] = {};
    G.cfg.items[item].sizes.forEach(sz => {
      stock[item][sz]  = stockIn[item]?.[sz] || 0;
      defect[item][sz] = 0;
    });
  });

  // 해당 시각 이전 dispatch만 반영
  G.dispatches.forEach(d => {
    const dt = d.createdAt?.toDate?.();
    if (!dt || dt > cutoff) return;
    if (!stock[d.item]) return;
    if (stock[d.item][d.size] === undefined)  stock[d.item][d.size]  = 0;
    if (defect[d.item][d.size] === undefined) defect[d.item][d.size] = 0;
    const q = d.qty || 1;
    if (d.type==='출고')       stock[d.item][d.size]  -= q;
    if (d.type==='반품')       stock[d.item][d.size]  += q;
    if (d.type==='반품입고')   stock[d.item][d.size]  += q;
    if (d.type==='교환출고')   stock[d.item][d.size]  -= q;
    if (d.type==='불량입고')   defect[d.item][d.size] += q;
    if (d.type==='교환반납') {
      if (d.exchangeType==='사이즈교환') stock[d.item][d.size]  += q;
      if (d.exchangeType==='불량')       defect[d.item][d.size] += q;
    }
  });
  return { stock, defect };
}

async function saveStockCheck() {
  const date = document.getElementById('checkDateInp')?.value || G._checkDate;
  const hour = G._checkHour !== undefined ? G._checkHour : new Date().getHours();
  if (!date) { showToast('조사 일자를 입력해주세요.', 'w'); return; }

  const sysAtTime = calcStockAtTime(date, hour);
  const items = getItemsBySeasonOrdered('동복').concat(getItemsBySeasonOrdered('하복'));
  const saves = [];

  items.forEach(item => {
    const cfg = G.cfg.items[item];
    if (!cfg) return;
    cfg.sizes.forEach(sz => {
      const 창고  = parseInt(document.getElementById('chk_창고_'  + item + '_' + sz)?.value)||0;
      const 교판실 = parseInt(document.getElementById('chk_교판실_' + item + '_' + sz)?.value)||0;
      const 샘플  = parseInt(document.getElementById('chk_샘플_'  + item + '_' + sz)?.value)||0;
      const 불량  = parseInt(document.getElementById('chk_불량_'  + item + '_' + sz)?.value)||0;
      const actual = 창고 + 교판실 + 샘플 + 불량;
      const note   = document.getElementById('chknote_' + item + '_' + sz)?.value.trim()||'';
      const sysStk = (sysAtTime.stock[item]?.[sz]||0) + (sysAtTime.defect[item]?.[sz]||0);
      saves.push({ item, size: sz, actual, 창고, 교판실, 샘플, 불량,
        sysStock: sysStk, diff: actual - sysStk,
        note, weekId: getWeekId(), checkDate: date, checkHour: hour, checkedBy: G.role });
    });
  });

  if (saves.length === 0) { showToast('입력된 수량이 없습니다.', 'w'); return; }

  try {
    showToast('저장 중...', 'w');

    // 같은 날짜+시간 기존 데이터 먼저 삭제 (덮어쓰기)
    const existing = G.stockChecks.filter(c => c.checkDate === date && c.checkHour === hour);

      const CHUNK = 400;

        const batch = db.batch();
        existing.slice(i, i+CHUNK).forEach(c => batch.delete(db.collection('stock_checks').doc(c.id)));
        await batch.commit();
      }
    }

    // 새로 저장
    const CHUNK = 400;
    for (let i = 0; i < saves.length; i += CHUNK) {
      const batch = db.batch();
      saves.slice(i, i+CHUNK).forEach(s => {
        batch.set(db.collection('stock_checks').doc(), {
          ...s, createdAt: firebase.firestore.Timestamp.now()
        });
      });
      await batch.commit();
    }

    await loadAll();
    const overwritten = existing.length > 0 ? ` (기존 데이터 덮어쓰기)` : '';
    showToast(`${date} ${String(hour).padStart(2,'0')}시 실재고 저장 완료${overwritten}`, 's');
    stockTabSel = 'history';
    renderStock();
  } catch(e) { showToast('오류: '+e.message,'e'); }
}

function exportStockReport() {
  // 현재 체크 이력 탭에서 선택된 세션 데이터 사용
  const sessKey = document.getElementById('histSessSel')?.value || '';
  const sessChecks = G.stockChecks.filter(c => {
    const k = c.checkDate ? c.checkDate+'_'+c.checkHour : (c.weekId||'');
    return k === sessKey;
  });
  const firstCheck = sessChecks[0];
  const sessSysAt = firstCheck?.checkDate
    ? calcStockAtTime(firstCheck.checkDate, firstCheck.checkHour||23)
    : calcStock();
  const checkMap = {};
  sessChecks.forEach(c => { checkMap[c.item+'_'+c.size] = c; });

  const rows = [];
  getItemsBySeasonOrdered('동복').concat(getItemsBySeasonOrdered('하복')).forEach(item => {
    const cfg = G.cfg.items[item];
    if (!cfg) return;
    cfg.sizes.forEach(sz => {
      const chk = checkMap[item+'_'+sz];
      const sysNormal = sessSysAt.stock[item]?.[sz] || 0;
      const sysDef    = sessSysAt.defect[item]?.[sz] || 0;
      const sysTotal  = sysNormal + sysDef;
      const actual    = chk?.actual;
      const diff      = actual !== undefined ? actual - sysTotal : '';
      rows.push({
        '품목': item,
        '사이즈': sz,
        '창고': chk?.창고 ?? '',
        '교판실': chk?.교판실 ?? '',
        '샘플': chk?.샘플 ?? '',
        '불량(실재고)': chk?.불량 ?? '',
        '실재고합계': actual ?? '',
        '시스템재고': sysNormal,
        '불량재고': sysDef || '',
        '차이': diff,
        '비고': chk?.note || '',
      });
    });
  });

  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [10,6,6,8,6,10,10,10,8,6,20].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  const label = firstCheck?.checkDate
    ? firstCheck.checkDate+'_'+String(firstCheck.checkHour||0).padStart(2,'0')+'시'
    : new Date().toLocaleDateString('ko-KR').replace(/\./g,'').replace(/ /g,'');
  XLSX.utils.book_append_sheet(wb, ws, '실재고체크');
  XLSX.writeFile(wb, `QUETTA_실재고_${label}.xlsx`);
}

    // 필터 적용
    let filtered = G.dispatches.filter(d => {

      if (ds < fFrom || ds > fTo) return false;

      ${statRows.length > 0 ? `
      <div style="margin-bottom:14px">
        <div style="font-size:12px;font-weight:700;color:var(--muted);margin-bottom:8px">📊 기간 내 출고 통계 (출고+교환출고 기준)</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">

  } else if (studentTabSel === 'dispatch_upload') {

        <button class="btn bw" onclick="document.getElementById('wdFile').click()">📂 파일 선택</button>
      </div>
      <div id="wd-preview"></div>
      <hr style="margin:16px 0;border:none;border-top:1px solid var(--bdr)">
      <div style="font-size:12px;font-weight:700;margin-bottom:8px">현재 퇴소 처리된 학생 (${G.students.filter(s=>s.withdrawn).length}명)</div>
      ${G.students.filter(s=>s.withdrawn).length === 0
        ? '<div class="notice" style="padding:12px">퇴소 처리된 학생이 없습니다.</div>'
        : `<div class="tw"><table class="tb">
            <thead><tr><th>이름</th><th>수험번호</th><th>과정</th><th>액션</th></tr></thead>

        const pageStudents = students.slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE);

            ? `<span class="badge bpurple">📋 일시예외처리</span>`

                ? `<span class="badge bok">완료</span>`
                : `<span class="badge berr">미수령 ${missing.length}건</span>`;

          const required = getStudentRequired(s);
          const progItems = Object.entries(required).map(([k,v]) => {
            const r = k==='하의_total' ? received['하의']||0 : received[k]||0;
            return `<div style="font-size:10px;color:var(--muted)">${k.replace('하의_total','하의')} ${r}/${v}</div>`;
          }).join('');

            <td class="tleft"><strong style="cursor:pointer;color:var(--accent)" onclick="switchTab('dispatch');setTimeout(()=>{document.getElementById('dSearch').value='${s.name}';searchDispatch()},100)">${s.name}</strong></td>
            <td>${s.examNo||'—'}</td><td>${s.studentNo||'—'}</td>
            <td>${s.season?s.season+'년':'—'}</td>
            <td>${s.course||'—'}</td>

        }).join('');

          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:6px">
            <span style="font-size:12px;color:var(--muted)">${pageInfo}</span>
            <div style="display:flex;gap:6px">${prevBtn}${nextBtn}</div>
          </div>
          <div class="tw"><table class="tb">

            <tbody>${rows}</tbody>
          </table></div>`;
      })()}`;
  }

  el.innerHTML = `
    <div class="ph"><div class="pt">👥 학생명단</div><div class="ps">학생 등록 및 출고 이력 관리</div></div>
    <div class="card">
      <div class="ttabs">
        <button class="ttab ${studentTabSel==='list'?'active':''}"             onclick="selStudentTab('list')">목록 (${G.students.length}명)</button>
        <button class="ttab ${studentTabSel==='manual'?'active':''}"           onclick="selStudentTab('manual')">✏️ 수기 등록</button>
        ${isAdmin()?`<button class="ttab ${studentTabSel==='upload'?'active':''}" onclick="selStudentTab('upload')">📂 명단 업로드</button>`:''}
        ${isAdmin()?`<button class="ttab ${studentTabSel==='dispatch_upload'?'active':''}" onclick="selStudentTab('dispatch_upload')">📤 출고이력 업로드</button>`:''}
        ${isAdmin()?`<button class="ttab ${studentTabSel==='withdrawn_upload'?'active':''}" onclick="selStudentTab('withdrawn_upload')">🚪 퇴소생 업로드</button>`:''}
        <button class="ttab ${studentTabSel==='history'?'active':''}"          onclick="selStudentTab('history')">📋 전체 출고이력</button>
      </div>
      ${bodyHtml}
    </div>`;
}

/* ── 수기 학생 등록 ── */
async function addStudentManual() {

  const exam   = document.getElementById('m_exam')?.value.trim();
  const sno    = document.getElementById('m_sno')?.value.trim();
