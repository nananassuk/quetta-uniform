/* ── 학생 명단 엑셀 업로드 ── */
function handleStudentDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) processStudentExcel(file);
}
function handleStudentFile(input) {
  const file = input.files[0];
  if (file) processStudentExcel(file);
}
function processStudentExcel(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
      if (data.length < 2) { showToast('데이터가 없습니다.', 'e'); return; }
      const rows = data.slice(1).filter(r => r[0]);
      const preview = rows.slice(0, 5);
      document.getElementById('upload-preview').innerHTML = `
        <div style="margin-bottom:10px;font-weight:600">미리보기 (${rows.length}명)</div>
        <div class="tw"><table class="tb">
          <thead><tr><th>이름</th><th>수험번호</th><th>학번</th><th>과정</th></tr></thead>
          <tbody>${preview.map(r=>`<tr><td>${r[0]||''}</td><td>${r[1]||''}</td><td>${r[2]||''}</td><td>${r[3]||''}</td></tr>`).join('')}</tbody>
        </table></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn bp" onclick="uploadStudents(${JSON.stringify(rows).replace(/"/g,'&quot;')})">✅ ${rows.length}명 업로드</button>
          <button class="btn bo" onclick="document.getElementById('upload-preview').innerHTML=''">취소</button>
        </div>`;
    } catch(err) { showToast('파일 파싱 오류: '+err.message, 'e'); }
  };
  reader.readAsBinaryString(file);
}
async function uploadStudents(rows) {
  if (typeof rows === 'string') { try { rows = JSON.parse(rows); } catch(e) { return; } }
  showToast('업로드 중...', 'w');
  try {
    for (const r of rows) {
      if (!r[0]) continue;
      await addDoc('students', { name: String(r[0]).trim(), examNo: String(r[1]||'').trim(), studentNo: String(r[2]||'').trim(), course: String(r[3]||'').trim(), exceptions: {}, memo: '' });
    }
    await loadAll();
    showToast(`${rows.length}명 업로드 완료`, 's');
    studentTabSel = 'list';
    renderStudents();
  } catch(e) { showToast('오류: '+e.message,'e'); }
}

/* ── 출고이력 업로드 (기존 시스템 엑셀) ── */
// 컬럼: 수험번호(0) / 학번(1) / 이름(2) / 과정(3) / 상품명(4) / 항목(5) / 옵션/사이즈(6) / 수량(7) / 일시(8)
// 헤더는 6행(index 5)에 있고 데이터는 7행부터
function handleDispatchHistoryDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) processDispatchHistoryExcel(file);
}
function handleDispatchHistoryFile(input) {
  const file = input.files[0];
  if (file) processDispatchHistoryExcel(file);
}
function processDispatchHistoryExcel(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

      // 헤더 행 자동 감지 — 이름 + 상품명 모두 있는 행
      let headerRowIdx = -1;
      for (let i = 0; i < Math.min(15, data.length); i++) {
        const row = data[i] || [];
        const hasName = row.some(c => String(c||'').trim() === '이름');
        const hasItem = row.some(c => String(c||'').trim().includes('상품'));
        if (hasName && hasItem) { headerRowIdx = i; break; }
      }
      if (headerRowIdx < 0) {
        document.getElementById('dh-preview').innerHTML = `<div style="color:var(--err);font-size:13px">⚠ 헤더 행을 찾을 수 없습니다. 파일에 "이름", "상품명" 컬럼이 있는지 확인해주세요.</div>`;
        return;
      }

      const headerRow = data[headerRowIdx] || [];
      const rows = data.slice(headerRowIdx + 1).filter(r => r && r.some(c => c !== undefined && c !== ''));

      // 컬럼 인덱스 — 완전일치 우선, 포함검색 fallback
      const fi = (keywords) => {
        let idx = headerRow.findIndex(h => keywords.some(k => String(h||'').trim() === k));
        if (idx >= 0) return idx;
        return headerRow.findIndex(h => keywords.some(k => String(h||'').trim().includes(k)));
      };
      const colIdx = {
        examNo:    fi(['수험번호']),
        studentNo: fi(['학번']),
        name:      fi(['이름']),
        course:    fi(['과정']),
        itemName:  fi(['상품명','상품']),
        type:      fi(['항목']),
        option:    fi(['옵션']),
        qty:       fi(['수량']),
        date:      fi(['입출고일시','일시','날짜']),
      };

      // 필수 컬럼 없으면 에러
      const missingCols = [];
      if (colIdx.name < 0)     missingCols.push('이름');
      if (colIdx.itemName < 0) missingCols.push('상품명');
      if (colIdx.option < 0)   missingCols.push('옵션');
      if (missingCols.length > 0) {
        document.getElementById('dh-preview').innerHTML = `
          <div style="color:var(--err);font-size:13px;font-weight:600">⚠ 필수 컬럼 없음: ${missingCols.join(', ')}</div>
          <div style="font-size:11px;margin-top:8px;background:#f8fafc;padding:10px;border-radius:8px;font-family:monospace">${headerRowIdx+1}행 헤더:<br>${headerRow.map((h,i)=>`[${i}] ${h||'(빈칸)'}`).join('<br>')}</div>`;
        return;
      }

      const itemMap = {
        '반집업세트':'반집업세트','반집업 세트':'반집업세트',
        '후드집업':'후드집업','후드 집업':'후드집업',
        '반팔티':'상의','상의':'상의',
        '긴바지':'긴바지','반바지':'반바지',
        '하복바지':'하복바지','하복 바지':'하복바지',
      };

      const parsed = [];
      for (const r of rows) {
        const name    = String(r[colIdx.name]     ?? '').trim();
        const examNo  = String(r[colIdx.examNo >= 0 ? colIdx.examNo : -1] ?? '').trim();
        const stuNo   = String(r[colIdx.studentNo >= 0 ? colIdx.studentNo : -1] ?? '').trim();
        const course  = String(r[colIdx.course >= 0 ? colIdx.course : -1] ?? '').trim();
        const itemRaw = String(r[colIdx.itemName] ?? '').trim();
        const typeRaw = String(r[colIdx.type >= 0 ? colIdx.type : -1] ?? '').trim();
        const optRaw  = String(r[colIdx.option]   ?? '').trim();
        const qty     = parseInt(r[colIdx.qty >= 0 ? colIdx.qty : -1]) || 1;
        const dateRaw = colIdx.date >= 0 ? r[colIdx.date] : '';
        if (!name || !itemRaw) continue;

        const dispTypeMap = {
          '판매출고': '출고',
          '출고예약': '미수령',
          '불량입고': '불량입고',
          '반품입고': '반품입고',
        };
        const dispType = dispTypeMap[typeRaw] || (typeRaw.includes('출고') ? '출고' : typeRaw || '출고');
        let item = itemMap[itemRaw] || itemRaw;
        let size = optRaw;

        if (item === '하복바지') {
          const lm = optRaw.match(/긴바지\s*([A-Z0-9]+)/);
          const sm = optRaw.match(/반바지\s*([A-Z0-9]+)/);
          if (lm)      { item = '긴바지'; size = lm[1]; }
          else if (sm) { item = '반바지'; size = sm[1]; }
          else         { item = '긴바지'; size = optRaw.replace(/[^A-Z0-9]/g,'') || optRaw; }
        } else {
          const szM = optRaw.match(/\b(4XL|3XL|2XL|XL|[SML])\b/);
          if (szM) size = szM[1];
        }
        if (!item || !size) continue;
        parsed.push({ examNo, studentNo: stuNo, name, course, item, type: dispType, size, qty, dateRaw });
      }

      function fmtDate(val) {
        if (!val && val !== 0) return '—';
        const n = parseFloat(val);
        if (!isNaN(n) && n > 40000) {
          const d = new Date((n - 25569) * 86400 * 1000);
          if (!isNaN(d)) return d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
        }
        return String(val).trim();
      }

      if (parsed.length === 0) {
        document.getElementById('dh-preview').innerHTML = `<div style="color:var(--err)">⚠ 데이터 없음. 헤더 ${headerRowIdx+1}행, 컬럼: ${Object.entries(colIdx).map(([k,v])=>k+'='+v).join(', ')}</div>`;
        return;
      }

      const preview = parsed.slice(0, 5);
      document.getElementById('dh-preview').innerHTML = `
        <div style="font-size:11px;color:var(--ok);margin-bottom:8px;background:#f0fdf4;padding:8px;border-radius:7px">
          ✓ 헤더 감지 (${headerRowIdx+1}행) — 이름[${colIdx.name}] 수험번호[${colIdx.examNo}] 과정[${colIdx.course}] 상품명[${colIdx.itemName}] 옵션[${colIdx.option}]
        </div>
        <div style="font-weight:600;margin-bottom:8px">미리보기 (총 ${parsed.length}건) — 이름·수험번호 확인 후 업로드하세요</div>
        <div class="tw"><table class="tb">
          <thead><tr><th>이름</th><th>수험번호</th><th>과정</th><th>품목</th><th>사이즈</th><th>수량</th><th>일시</th></tr></thead>
          <tbody>${preview.map(r=>`<tr>
            <td><strong>${r.name}</strong></td><td>${r.examNo||'—'}</td><td>${r.course||'—'}</td>
            <td>${r.item}</td><td>${r.size}</td><td>${r.qty}</td>
            <td style="font-size:11px">${fmtDate(r.dateRaw)}</td>
          </tr>`).join('')}</tbody>
        </table></div>
        <div style="margin-top:6px;font-size:11px;color:var(--muted)">... 외 ${Math.max(0,parsed.length-5)}건</div>
        <div style="margin-top:10px;display:flex;gap:8px">
          <button class="btn bp" id="dh-upload-btn" onclick="uploadDispatchHistory()">✅ ${parsed.length}건 업로드</button>
          <button class="btn bo" onclick="document.getElementById('dh-preview').innerHTML=''">취소</button>
        </div>`;
      window._pendingDispatchRows = parsed;
    } catch(err) { showToast('파일 파싱 오류: '+err.message, 'e'); }
  };
  reader.readAsBinaryString(file);
}

async function uploadDispatchHistory() {
  const rows = window._pendingDispatchRows;
  if (!rows || rows.length === 0) { showToast('업로드할 데이터가 없습니다.', 'w'); return; }
  const btn = document.getElementById('dh-upload-btn');
  if (btn) { btn.disabled = true; btn.textContent = '준비 중...'; }

  const courseNorm = {
    'WINTER':'윈터','Winter':'윈터','winter':'윈터',
    'ZERO':'제로','Zero':'제로','zero':'제로',
    'REGULAR':'정규','Regular':'정규','regular':'정규',
  };

  function fmtDate(val) {
    if (!val) return null;
    const n = parseFloat(val);
    if (!isNaN(n) && n > 40000) return new Date((n - 25569) * 86400 * 1000);
    const d = new Date(String(val).replace(' ','T'));
    return isNaN(d) ? null : d;
  }

  try {
    // 기존 학생 해시맵 (네트워크 없이 즉시)
    const byExam = {}, byName = {};
    G.students.forEach(s => {
      if (s.examNo) byExam[String(s.examNo).trim()] = s;
      if (s.name)   byName[s.name.trim()] = s;
    });

    const CHUNK = 400;
    let count = 0;
    let batchDocs = [];
    if (btn) btn.textContent = `업로드 중... (0/${rows.length})`;

    for (const r of rows) {
      const course  = courseNorm[r.course] || r.course;
      const examKey = String(r.examNo||'').trim();
      const student = (examKey && byExam[examKey]) || byName[r.name?.trim()];
      const dt = fmtDate(r.dateRaw);

      batchDocs.push({
        studentId:   student ? student.id : null,
        studentName: r.name || '',
        examNo:      r.examNo || '',
        course:      course,
        item:        r.item,
        size:        r.size,
        qty:         r.qty || 1,
        type:        r.type,
        note:        '기존이력업로드',
        createdBy:   'import',
        deleted:     false,
        createdAt:   dt ? firebase.firestore.Timestamp.fromDate(dt) : firebase.firestore.Timestamp.now(),
      });

      if (batchDocs.length >= CHUNK) {
        const batch = db.batch();
        batchDocs.forEach(doc => batch.set(db.collection('dispatches').doc(), doc));
        await batch.commit();
        count += batchDocs.length;
        batchDocs = [];
        if (btn) btn.textContent = `업로드 중... (${count}/${rows.length})`;
      }
    }

    if (batchDocs.length > 0) {
      const batch = db.batch();
      batchDocs.forEach(doc => batch.set(db.collection('dispatches').doc(), doc));
      await batch.commit();
      count += batchDocs.length;
    }

    await loadAll();
    window._pendingDispatchRows = null;
    showToast(`${count}건 업로드 완료! 🎉`, 's');
    studentTabSel = 'history';
    renderStudents();
  } catch(e) {
    showToast('오류: '+e.message, 'e');
    if (btn) { btn.disabled = false; btn.textContent = '다시 시도'; }
  }
}

// 컬럼: 수험번호(0) / 이름(1)
function handleWithdrawnDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (file) processWithdrawnExcel(file);
}
function handleWithdrawnFile(input) {
  const file = input.files[0];
  if (file) processWithdrawnExcel(file);
}
function processWithdrawnExcel(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(e.target.result, { type: 'binary' });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const data = XLSX.utils.sheet_to_json(ws, { header: 1 });
      const rows = data.slice(1).filter(r => r[0] || r[1]);
      if (rows.length === 0) { showToast('데이터가 없습니다.', 'e'); return; }
      const parsed = rows.map(r => ({
        examNo: String(r[0]||'').trim(),
        name:   String(r[1]||'').trim(),
      })).filter(r => r.examNo || r.name);

      document.getElementById('wd-preview').innerHTML = `
        <div style="margin-bottom:10px;font-weight:600">미리보기 (${parsed.length}명)</div>
        <div class="tw"><table class="tb">
          <thead><tr><th>수험번호</th><th>이름</th><th>매칭 결과</th></tr></thead>
          <tbody>${parsed.map(r => {
            const matched = G.students.find(s => (r.examNo && s.examNo === r.examNo) || (r.name && s.name === r.name));
            return `<tr>
              <td>${r.examNo||'—'}</td>
              <td>${r.name||'—'}</td>
              <td>${matched ? `<span class="badge bok">✓ ${matched.name} (${matched.course})</span>` : `<span class="badge berr">명단 없음</span>`}</td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn bw" onclick="uploadWithdrawn(${JSON.stringify(parsed).replace(/"/g,'&quot;')})">🚪 ${parsed.length}명 퇴소 처리</button>
          <button class="btn bo" onclick="document.getElementById('wd-preview').innerHTML=''">취소</button>
        </div>`;
    } catch(err) { showToast('파일 파싱 오류: '+err.message, 'e'); }
  };
  reader.readAsBinaryString(file);
}
async function uploadWithdrawn(rows) {
  if (typeof rows === 'string') { try { rows = JSON.parse(rows); } catch(e) { return; } }
  let count = 0, notFound = 0;
  try {
    for (const r of rows) {
      const student = G.students.find(s =>
        (r.examNo && s.examNo === r.examNo) || (r.name && s.name === r.name)
      );
      if (!student) { notFound++; continue; }
      await updateDoc('students', student.id, { withdrawn: true });
      count++;
    }
    await loadAll();
    showToast(`퇴소 처리 완료: ${count}명${notFound > 0 ? ` (명단 없음: ${notFound}명)` : ''}`, 's');
    renderStudents();
  } catch(e) { showToast('오류: '+e.message,'e'); }
}
/* ── 500개 제한 우회 배치 삭제 헬퍼 ── */
async function batchDeleteAll(collectionName) {
  const CHUNK = 400;
  while (true) {
    const snap = await db.collection(collectionName).limit(CHUNK).get();
    if (snap.empty) break;
    const batch = db.batch();
    snap.docs.forEach(d => batch.delete(d.ref));
    await batch.commit();
  }
}

async function recoverOrphanDispatches() {
  const orphans = G.dispatches.filter(d => !d.studentId);
  if (orphans.length === 0) { showToast('미연결 이력이 없습니다.', 'w'); return; }
  if (!confirm(`학생명단에 없는 출고이력 ${orphans.length}건을 복구합니다.\n해당 학생들은 "일시예외처리(퇴소)"로 자동 등록됩니다.\n미수령 관리 대상에서 제외됩니다.\n진행하시겠습니까?`)) return;

  const courseNorm = {
    'WINTER':'윈터','Winter':'윈터','winter':'윈터',
    'ZERO':'제로','Zero':'제로','zero':'제로',
    'REGULAR':'정규','Regular':'정규','regular':'정규',
  };

  showToast('복구 중...', 'w');
  try {
    // 1. 고유 학생 목록 추출
    const uniqueStudents = {};
    orphans.forEach(d => {
      const key = d.examNo || d.studentName;
      if (!uniqueStudents[key]) {
        uniqueStudents[key] = {
          name: d.studentName || '',
          examNo: d.examNo || '',
          course: courseNorm[d.course] || d.course || '',
          studentNo: '',
          exceptions: {}, memo: '',
          withdrawn: true,
          withdrawnReason: '일시예외처리',
          withdrawnDate: '',
          isTemporaryException: true,
        };
      }
    });

    // 2. 학생 배치 생성
    const CHUNK = 400;
    const keys = Object.keys(uniqueStudents);
    const createdMap = {};
    showToast(`학생 ${keys.length}명 일시예외처리 등록 중...`, 'w');

    for (let i = 0; i < keys.length; i += CHUNK) {
      const batch = db.batch();
      keys.slice(i, i + CHUNK).forEach(key => {
        const ref = db.collection('students').doc();
        batch.set(ref, { ...uniqueStudents[key], createdAt: firebase.firestore.Timestamp.now() });
        createdMap[key] = ref.id;
      });
      await batch.commit();
    }

    // 3. orphan dispatch에 studentId 연결
    let updated = 0;
    for (let i = 0; i < orphans.length; i += CHUNK) {
      const batch = db.batch();
      orphans.slice(i, i + CHUNK).forEach(d => {
        const key = d.examNo || d.studentName;
        const studentId = createdMap[key];
        if (studentId) {
          batch.update(db.collection('dispatches').doc(d.id), { studentId });
          updated++;
        }
      });
      await batch.commit();
    }

    await loadAll();
    showToast(`복구 완료! 일시예외처리 ${keys.length}명 등록, 이력 ${updated}건 연결 🎉`, 's');
    selStudentTab('dispatch_upload');
  } catch(e) { showToast('오류: '+e.message,'e'); }
}

function exportDispatchHistory() {
  const fFrom   = document.getElementById('hf_from')?.value   || '';
  const fTo     = document.getElementById('hf_to')?.value     || '';
  const fCourse = document.getElementById('hf_course')?.value || '전체';
  const fItem   = document.getElementById('hf_item')?.value   || '전체';
  const fType   = document.getElementById('hf_type')?.value   || '전체';

  let data = G.dispatches.filter(d => {
    const dt = d.createdAt?.toDate?.();
    if (!dt) return false;
    const ds = dt.toISOString().split('T')[0];
    if (fFrom && ds < fFrom) return false;
    if (fTo   && ds > fTo)   return false;
    if (fCourse !== '전체' && d.course !== fCourse) return false;
    if (fItem   !== '전체' && d.item   !== fItem)   return false;
    if (fType   !== '전체' && d.type   !== fType)   return false;
    return true;
  }).sort((a,b)=>(b.createdAt?.toDate?.()?.getTime()||0)-(a.createdAt?.toDate?.()?.getTime()||0));

  const rows = data.map(d => ({
    '일시': d.createdAt?.toDate?.()?.toLocaleString?.('ko-KR')||'',
    '이름': d.studentName||'', '수험번호': d.examNo||'',
    '과정': d.course||'', '품목': d.item||'', '사이즈': d.size||'',
    '유형': d.type||'', '수량': d.qty||1, '비고': d.note||''
  }));
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '출고이력');
  const range = (fFrom||fTo) ? ('_'+fFrom+'~'+fTo) : '';
  XLSX.writeFile(wb, 'QUETTA_출고이력'+range+'.xlsx');
}

        <button class="ttab ${settingsTabSel==='items'?'active':''}"     onclick="selSettingsTab('items')">👕 사이즈 관리</button>
        <button class="ttab ${settingsTabSel==='season'?'active':''}"    onclick="selSettingsTab('season')">📅 시즌·기본값</button>
        <button class="ttab ${settingsTabSel==='password'?'active':''}"  onclick="selSettingsTab('password')">🔐 비밀번호</button>
        <button class="ttab ${settingsTabSel==='yeardata'?'active':''}"  onclick="selSettingsTab('yeardata')">🗄 연도별 데이터</button>
      </div>
      ${bodyHtml}
    </div>`;
}
function selSettingsTab(t) { settingsTabSel = t; renderSettings(); }

/* ═══════════════════════════════════════════════
   연도별 데이터 관리
   ═══════════════════════════════════════════════ */
async function loadBackupList() {
  const wrap = document.getElementById('backup-list-wrap');
  if (!wrap) return;
  try {
    const backups = await getDocs('backups');
    backups.sort((a,b) => (b.createdAt?.toDate?.()?.getTime()||0) - (a.createdAt?.toDate?.()?.getTime()||0));
    if (backups.length === 0) {
      wrap.innerHTML = '<div class="notice" style="padding:12px">저장된 백업이 없습니다.</div>';
      return;
    }
    wrap.innerHTML = `<div class="tw"><table class="tb">
      <thead><tr><th>연도</th><th>백업명</th><th>학생수</th><th>출고건수</th><th>백업일시</th><th>액션</th></tr></thead>
      <tbody>${backups.map(b => {
        const dt = b.createdAt?.toDate?.()?.toLocaleString?.('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})||'—';
        return `<tr>
          <td><strong>${b.year}년</strong></td>
          <td>${b.label||'—'}</td>
          <td>${b.studentCount||0}명</td>
          <td>${b.dispatchCount||0}건</td>
          <td style="font-size:11px">${dt}</td>
          <td style="display:flex;gap:4px;flex-wrap:wrap">
            <button class="btn bo btn-xs" onclick="exportBackupExcel('${b.id}')">📥 엑셀</button>
            <button class="btn be btn-xs" onclick="deleteBackup('${b.id}','${b.year}년 ${b.label||''}')">삭제</button>
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>`;
  } catch(e) { wrap.innerHTML = `<div class="notice">불러오기 실패: ${e.message}</div>`; }
}

async function doBackup() {
  const year  = parseInt(document.getElementById('backupYear')?.value) || new Date().getFullYear();
  const label = document.getElementById('backupLabel')?.value.trim() || '';
  if (!confirm(`${year}년 데이터를 백업하시겠습니까?\n학생 ${G.students.length}명, 출고이력 ${G.dispatches.length}건이 저장됩니다.`)) return;
  showToast('백업 중...', 'w');
  try {
    // 학생·출고·재고 스냅샷 저장
    const studentsSnap  = G.students.map(s => ({...s}));
    const dispatchSnap  = G.dispatches.map(d => ({
      ...d,
      createdAt: d.createdAt?.toDate?.()?.toISOString() || null
    }));
    const stockSnap = G.stockIn;

    await addDoc('backups', {
      year, label,
      studentCount:  studentsSnap.length,
      dispatchCount: dispatchSnap.length,
      students:  studentsSnap,
      dispatches: dispatchSnap,
      stockIn:   stockSnap,
    });
    showToast(`${year}년 백업 완료! 🎉`, 's');
    loadBackupList();
  } catch(e) { showToast('백업 실패: '+e.message, 'e'); }
}

async function doSeasonReset() {
  if (!confirm('⚠️ 새 시즌 리셋\n\n학생명단, 출고이력, 재고가 모두 초기화됩니다.\n반드시 백업을 먼저 완료하세요!\n\n정말 진행하시겠습니까?')) return;
  if (!confirm('⚠️ 마지막 확인!\n\n이 작업은 되돌릴 수 없습니다.\n초기화를 진행합니까?')) return;
  showToast('초기화 중...', 'w');
  try {
    for (const col of ['students','dispatches','stock_in','stock_checks']) {
      await batchDeleteAll(col);
    }
    await loadAll();
    showToast('새 시즌 리셋 완료! 새 학생명단을 업로드해주세요.', 's');
    switchTab('dashboard');
  } catch(e) { showToast('초기화 실패: '+e.message, 'e'); }
}

async function exportBackupExcel(backupId) {
  try {
    const backup = await getDoc('backups', backupId);
    if (!backup) { showToast('백업 데이터를 찾을 수 없습니다.', 'e'); return; }
    const wb = XLSX.utils.book_new();

    // 학생 시트
    const stuRows = (backup.students||[]).map(s => ({
      '이름': s.name||'', '수험번호': s.examNo||'', '학번': s.studentNo||'',
      '과정': s.course||'', '퇴소여부': s.withdrawn?'퇴소':'재학', '메모': s.memo||''
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(stuRows), '학생명단');

    // 출고이력 시트
    const dispRows = (backup.dispatches||[]).map(d => ({
      '일시': d.createdAt||'', '이름': d.studentName||'', '수험번호': d.examNo||'',
      '과정': d.course||'', '품목': d.item||'', '사이즈': d.size||'',
      '유형': d.type||'', '수량': d.qty||1, '비고': d.note||''
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(dispRows), '출고이력');

    XLSX.writeFile(wb, `QUETTA_${backup.year}년_${backup.label||'백업'}.xlsx`);
    showToast('엑셀 다운로드 완료', 's');
  } catch(e) { showToast('다운로드 실패: '+e.message, 'e'); }
}

async function deleteBackup(id, name) {
  if (!confirm(`"${name}" 백업을 삭제하시겠습니까?\n삭제된 백업은 복구할 수 없습니다.`)) return;
  try {
    await deleteDoc('backups', id);
    showToast('백업 삭제됨');
    loadBackupList();
  } catch(e) { showToast('삭제 실패: '+e.message, 'e'); }
}

async function saveCourseConfig() {
  Object.keys(G.cfg.courses).forEach(course => {
    const keys = [
      ...Object.keys(G.cfg.items).filter(i => G.cfg.items[i].season === '동복'),
      ...Object.keys(G.cfg.items).filter(i => G.cfg.items[i].season === '하복' && i !== '긴바지' && i !== '반바지'),
      '하의_total'
    ];
    keys.forEach(k => {
      const v = parseInt(document.getElementById(`cc_${course}_${k}`)?.value) || 0;
      G.cfg.courses[course][k] = v;
    });
  });
  await saveConfig();
  showToast('과정 설정 저장됨', 's');
}

function addCourse() {
  const name = prompt('새 과정 이름을 입력하세요:');
  if (!name || G.cfg.courses[name]) return;
  G.cfg.courses[name] = {};
  renderSettings();
}

async function addSeason() {
  const val = document.getElementById('newSeasonYear')?.value.trim();
  if (!val) return;
  if ((G.cfg.seasons||[]).includes(val)) { showToast('이미 있는 시즌입니다.','w'); return; }
  if (!G.cfg.seasons) G.cfg.seasons = [];
  G.cfg.seasons.push(val);
  G.cfg.seasons.sort((a,b) => b-a);
  await saveConfig();
  showToast(`${val}년 시즌 추가됨`,'s');
  renderSettings();
}
async function removeSeason(idx) {
  const s = G.cfg.seasons[idx];
  if (!confirm(`${s}년 시즌을 삭제하시겠습니까?`)) return;
  G.cfg.seasons.splice(idx,1);
  await saveConfig();
  showToast('삭제됨');
  renderSettings();
}
async function saveDefaults() {
  const season = document.getElementById('def_season')?.value;
  const course = document.getElementById('def_course')?.value;
  G.cfg.defaults = { season, course };
  await saveConfig();
  const msg = document.getElementById('def-msg');
  if (msg) { msg.style.color='var(--ok)'; msg.textContent=`✓ 기본값 저장됨 — ${season}년 / ${course}`; }
  showToast('기본값 저장됨','s');
}
async function addSize(item) {
  const inp = document.getElementById(`addSz_${item}`);
  const sz = inp.value.trim().toUpperCase();
  if (!sz) return;
  if (G.cfg.items[item].sizes.includes(sz)) { showToast('이미 있는 사이즈입니다.','w'); return; }
  G.cfg.items[item].sizes.push(sz);
  await saveConfig();
  showToast(`${item} ${sz} 추가됨`, 's');
  renderSettings();
}
async function removeSize(item, sz) {
  if (!confirm(`${item} ${sz} 사이즈를 삭제하시겠습니까?`)) return;
  G.cfg.items[item].sizes = G.cfg.items[item].sizes.filter(s => s !== sz);
  await saveConfig();
  showToast('삭제됨');
  renderSettings();
}

async function changePw(role) {
  const cur = document.getElementById(`pw_cur_${role}`).value;
  const nw  = document.getElementById(`pw_new_${role}`).value;
  if (cur !== G.cfg.passwords[role]) { showToast('현재 비밀번호 불일치','e'); return; }
  if (!nw) { showToast('새 비밀번호 입력','w'); return; }
  G.cfg.passwords[role] = nw;
  await saveConfig();
  showToast('비밀번호 변경됨','s');
  document.getElementById(`pw_cur_${role}`).value = '';
  document.getElementById(`pw_new_${role}`).value = '';
}

/* ═══════════════════════════════════════════════
   모달 유틸
   ═══════════════════════════════════════════════ */
function openModal(id) { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

/* ═══════════════════════════════════════════════
   토스트
   ═══════════════════════════════════════════════ */
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.classList.remove('show'), 2800);
}

/* ═══════════════════════════════════════════════
   이벤트 초기화
   ═══════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sidebar').addEventListener('click', e => {
    const item = e.target.closest('.ni[data-tab]');
    if (item) switchTab(item.dataset.tab);
  });
});
</script>
